<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用数据看板构建器</title>
<style>
  :root{
    --bg:#eef3fb; --card:#fff; --ink:#1f2d3d; --sub:#8a97a8; --line:#e7edf5;
    --blue:#3b82f6; --green:#22c55e; --gray:#9aa7b5; --purple:#a855f7;
    --teal:#14b8a6; --orange:#f59e0b; --pink:#ec4899; --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);padding:20px 24px 48px;}
  .page{max-width:1240px;margin:0 auto;}
  .hidden{display:none !important;}

  .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  .header .title{font-size:20px;font-weight:700;}
  .header .sub{font-size:12px;font-weight:400;color:var(--sub);margin-top:3px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:none;cursor:pointer;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(30,50,80,.1);transition:.15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,50,80,.15);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);}
  .btn.sm{padding:5px 10px;font-size:12px;}

  /* 看板页签栏 */
  .tabs-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgba(30,50,80,.06);margin-bottom:14px;overflow-x:auto;}
  .tabs-label{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap;}
  .dash-tabs{display:flex;gap:6px;align-items:center;flex:1;}
  .dash-tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;border:1px solid transparent;}
  .dash-tab:hover{background:#f2f6fb;}
  .dash-tab.active{background:#e8f0fe;color:var(--blue);font-weight:600;}
  .dash-tab .menu-btn{opacity:0;cursor:pointer;font-size:14px;color:var(--sub);padding:0 2px;border:none;background:none;}
  .dash-tab:hover .menu-btn,.dash-tab.active .menu-btn{opacity:1;}
  .dash-add{font-size:18px;font-weight:600;color:var(--sub);cursor:pointer;padding:4px 10px;border-radius:8px;white-space:nowrap;}
  .dash-add:hover{background:#f2f6fb;color:var(--blue);}
  .menu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;z-index:120;min-width:130px;}
  .menu .mi{padding:8px 12px;font-size:13px;cursor:pointer;border-radius:7px;}
  .menu .mi:hover{background:#f2f6fb;}
  .menu .mi.danger{color:var(--red);}

  /* 画布（自由布局容器） */
  #canvas{position:relative;margin:0 auto;background:#f6f9fd;border-radius:14px;padding:16px;min-height:420px;}
  .module{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(30,50,80,.08);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);}
  .module.dragging{box-shadow:0 10px 30px rgba(30,50,80,.2);z-index:10;}
  .module-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:move;user-select:none;border-bottom:1px solid var(--line);background:#fafcff;flex-shrink:0;}
  .module-bar .m-title{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .module-bar .m-type{font-size:11px;color:var(--sub);font-weight:400;white-space:nowrap;}
  .m-actions{display:flex;gap:4px;}
  .m-actions .btn{box-shadow:none;background:#f2f6fb;padding:3px 8px;font-size:11px;line-height:1.4;}
  .module-body{flex:1;overflow:auto;padding:12px;}
  .resize-h{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5;}
  .resize-h::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-right:2px solid #c3ccd8;border-bottom:2px solid #c3ccd8;border-radius:0 0 3px 0;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .kpi{background:#f8fafc;border-radius:12px;padding:14px 16px;border-left:4px solid var(--gray);}
  .kpi .k-label{font-size:12px;color:var(--sub);margin-bottom:8px;}
  .kpi .k-value{font-size:26px;font-weight:700;line-height:1;}
  .kpi .k-sub{font-size:11px;color:var(--sub);margin-top:8px;}
  .c-blue{border-left-color:var(--blue);} .c-blue .k-value{color:var(--blue);}
  .c-green{border-left-color:var(--green);} .c-green .k-value{color:var(--green);}
  .c-gray{border-left-color:var(--gray);}
  .c-purple{border-left-color:var(--purple);} .c-purple .k-value{color:var(--purple);}
  .c-teal{border-left-color:var(--teal);} .c-teal .k-value{color:var(--teal);}
  .c-orange{border-left-color:var(--orange);} .c-orange .k-value{color:var(--orange);}
  .c-pink{border-left-color:var(--pink);} .c-pink .k-value{color:var(--pink);}
  .c-red{border-left-color:var(--red);} .c-red .k-value{color:var(--red);}
  .stat{background:#f8fafc;border-radius:12px;padding:16px;border-left:4px solid var(--gray);}
  .stat .s-label{font-size:12px;color:var(--sub);margin-bottom:10px;}
  .stat .s-value{font-size:30px;font-weight:700;line-height:1;}
  .stat .s-suffix{font-size:15px;color:var(--sub);margin-left:4px;font-weight:600;}

  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .shop{background:#f8fafc;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .shop .s-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;color:#fff;}
  .shop .s-head .s-name{font-size:14px;font-weight:700;}
  .shop .s-head .s-brand{font-size:11px;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:10px;}
  .shop .s-body{padding:12px 14px;}
  .shop .s-nums{display:grid;gap:8px;margin-bottom:12px;}
  .shop .s-nums .sn{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:5px;}
  .shop .s-nums .sn .l{font-size:12px;color:var(--sub);}
  .shop .s-nums .sn .v{font-size:17px;font-weight:700;}
  .shop .s-ratios{display:flex;flex-direction:column;gap:8px;}
  .shop .sr .top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
  .shop .sr .top .lab{color:var(--sub);}
  .shop .sr .top .val{font-weight:600;}
  .shop .bar{height:6px;border-radius:4px;background:#eef2f7;overflow:hidden;}
  .shop .bar i{display:block;height:100%;border-radius:4px;}
  .num-neg{color:var(--red);}
  .bg-blue{background:var(--blue);} .bar-blue i{background:var(--blue);}
  .bg-teal{background:var(--teal);} .bar-teal i{background:var(--teal);}
  .bg-purple{background:var(--purple);} .bar-purple i{background:var(--purple);}
  .bg-orange{background:var(--orange);} .bar-orange i{background:var(--orange);}
  .bg-green{background:var(--green);} .bar-green i{background:var(--green);}
  .bg-pink{background:var(--pink);} .bar-pink i{background:var(--pink);}
  .bg-red{background:var(--red);} .bar-red i{background:var(--red);}

  .rank{background:#f8fafc;border-radius:12px;padding:4px 0;}
  .rank .rk{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);}
  .rank .rk:last-child{border-bottom:none;}
  .rank .rk .idx{width:24px;height:24px;border-radius:7px;background:#eef2f7;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .rank .rk:nth-child(1) .idx{background:#ffd76e;color:#7a5a00;}
  .rank .rk:nth-child(2) .idx{background:#cfd6e0;color:#4a5568;}
  .rank .rk:nth-child(3) .idx{background:#e8b48c;color:#7a4a20;}
  .rank .rk .rk-name{flex:1;font-size:13px;}
  .rank .rk .rk-val{font-size:15px;font-weight:700;}

  table.detail{width:100%;border-collapse:collapse;font-size:12px;}
  table.detail th,table.detail td{border:1px solid var(--line);padding:7px 10px;text-align:center;}
  table.detail th{background:#f5f8fc;font-weight:600;}

  .chart-el{width:100%;height:100%;min-height:200px;}
  .chart-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;}
  .text-mod{font-size:14px;line-height:1.7;}
  .empty{background:var(--card);border-radius:12px;padding:30px;text-align:center;color:var(--sub);box-shadow:0 2px 10px rgba(30,50,80,.06);}
  .canvas-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;}

  .modal-mask{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:50;overflow:auto;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:960px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:16px;font-weight:700;}
  .modal-head .x{cursor:pointer;font-size:22px;color:var(--sub);line-height:1;}
  .modal-body{padding:18px 24px;max-height:74vh;overflow:auto;}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
  .split{display:grid;grid-template-columns:220px 1fr;gap:18px;}
  .sidelist{border-right:1px solid var(--line);padding-right:14px;}
  .sidelist .sl-item{padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
  .sidelist .sl-item.active{background:#e8f0fe;color:var(--blue);font-weight:600;}
  .sidelist .sl-item .d{color:var(--red);cursor:pointer;font-weight:400;font-size:12px;}
  .f-label{font-size:13px;font-weight:600;margin:14px 0 8px;}
  .field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .field-row input,.field-row select,.cfg-row input,.cfg-row select,.cfg-row textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;}
  .cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .cfg-row label{font-size:13px;color:var(--sub);min-width:72px;}
  .cfg-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfcfe;}
  .cfg-item .cfg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:13px;}
  .cfg-item .cfg-head .c-del{color:var(--red);cursor:pointer;font-size:12px;}
  .field-row .fd,.cfg-item .fd{color:var(--red);cursor:pointer;font-size:13px;}
  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th,table.data td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  table.data th{background:#f5f8fc;font-weight:600;}
  table.data input{width:100%;border:none;text-align:center;font-size:13px;outline:none;background:transparent;}
  .hint{font-size:12px;color:var(--sub);margin:6px 0 14px;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;}
  /* 深色主题 */
  body.dark{--bg:#1a1f2e;--card:#252b3d;--ink:#e4e8f0;--sub:#7a85a0;--line:#384055;}
  body.dark .module-bar{background:#2a3045;}
  body.dark .kpi,body.dark .stat,body.dark .shop{background:#2a3045;}
  body.dark .rank{background:#2a3045;}
  body.dark .rank .rk{border-color:#384055;}
  body.dark table.detail th{background:#2a3045;}
  body.dark .m-actions .btn{background:#2a3045;}
  body.dark #canvas{background:#1e2333;}

  /* 全局筛选器 */
  .filter-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(30,50,80,.06);margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar .f-label2{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap;}
  .filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:var(--card);color:var(--ink);}
  .filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue);}
  .filter-bar .f-tag{display:inline-flex;align-items:center;gap:6px;background:#e8f0fe;color:var(--blue);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
  body.dark .filter-bar .f-tag{background:#2a3a5e;}
  .filter-bar .f-tag .x{cursor:pointer;font-size:14px;}

  /* 对齐线 */
  .align-line{position:absolute;background:var(--blue);pointer-events:none;z-index:100;opacity:.7;}
  .align-line.h{height:1px;left:0;right:0;}
  .align-line.v{width:1px;top:0;bottom:0;}

  /* 组件隐藏标记 */
  .module.hidden-w{display:none;}
  .module-bar .vis-btn{cursor:pointer;font-size:14px;opacity:.5;}
  .module-bar .vis-btn:hover{opacity:1;}

  /* 表格搜索/排序 */
  .table-tools{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .table-tools input{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;outline:none;background:var(--card);color:var(--ink);flex:1;max-width:220px;}
  table.detail th.sortable{cursor:pointer;user-select:none;}
  table.detail th.sortable:hover{color:var(--blue);}
  table.detail th .sort-arrow{font-size:10px;margin-left:2px;}

  @media(max-width:900px){
    .module{position:static;width:100% !important;height:auto !important;margin-bottom:14px;}
    .resize-h{display:none;}
    #canvas{min-height:auto;}
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div>
      <div class="title" id="appTitle">通用数据看板</div>
      <div class="sub" id="appSub"></div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="openSources()">数据源管理</button>
      <button class="btn" onclick="openWidgets()">组件管理</button>
      <button class="btn primary" onclick="addWidgetMenu()">+ 添加组件</button>
      <button class="btn" onclick="toggleFilterBar()">筛选</button>
      <button class="btn" onclick="toggleTheme()">主题</button>
      <button class="btn" onclick="exportImage()">导出图片</button>
      <button class="btn ghost" onclick="exportJSON()">导出配置</button>
      <button class="btn ghost" onclick="importJSON()">导入配置</button>
      <button class="btn ghost" onclick="loadExample()">载入示例</button>
      <button class="btn ghost" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="tabs-wrap">
    <span class="tabs-label">看板</span>
    <div class="dash-tabs" id="dashTabs"></div>
    <span class="dash-add" onclick="addDashboard()" title="新建看板">+ 新建看板</span>
  </div>

  <!-- 全局筛选器 -->
  <div class="filter-bar hidden" id="filterBar">
    <span class="f-label2">全局筛选</span>
    <select id="filterSource" onchange="renderFilterFields()"><option value="">选择数据源</option></select>
    <select id="filterField" onchange="renderFilterValues()"><option value="">选择字段</option></select>
    <select id="filterValue" onchange="applyFilter()"><option value="">全部</option></select>
    <button class="btn sm" onclick="clearFilter()">清除筛选</button>
    <span id="filterTags"></span>
  </div>

  <div id="canvas"></div>

</div>

<div class="modal-mask hidden" id="typeModal">
  <div class="modal" style="max-width:720px">
    <div class="modal-head"><h3>选择组件类型</h3><span class="x" onclick="closeModal('typeModal')">&times;</span></div>
    <div class="modal-body" id="typeList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;"></div>
  </div>
</div>

<div class="modal-mask hidden" id="srcModal">
  <div class="modal">
    <div class="modal-head"><h3>数据源管理（全局共享）</h3><span class="x" onclick="closeModal('srcModal')">&times;</span></div>
    <div class="modal-body"><div class="split"><div class="sidelist"><div class="f-label">数据源列表</div><div id="srcList"></div><button class="btn sm" onclick="addSource()">+ 新建数据源</button></div><div id="srcEditor"></div></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('srcModal')">取消</button><button class="btn primary" onclick="saveSources()">保存全部</button></div>
  </div>
</div>

<div class="modal-mask hidden" id="widgetModal">
  <div class="modal">
    <div class="modal-head"><h3>组件管理（当前看板）</h3><span class="x" onclick="closeModal('widgetModal')">&times;</span></div>
    <div class="modal-body"><div id="widgetList"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('widgetModal')">关闭</button></div>
  </div>
</div>

<div class="modal-mask hidden" id="widgetCfgModal">
  <div class="modal">
    <div class="modal-head"><h3>组件配置</h3><span class="x" onclick="closeModal('widgetCfgModal')">&times;</span></div>
    <div class="modal-body"><div class="cfg-row" style="margin-bottom:6px"><input id="cfgName" placeholder="组件名称" style="flex:1;font-weight:600"></div><div id="cfgBody"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('widgetCfgModal')">取消</button><button class="btn primary" onclick="saveWidget()">保存配置</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
/* ================= 帮助函数 ================= */
function uid(p){ return (p||"x")+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function num(v){ let n=parseFloat(v); return isNaN(n)?0:n; }
function pct(x){ return (x*100).toFixed(1)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
const AGGS=["sum","avg","count","max","min"];
const COLORS=["blue","green","gray","purple","teal","orange","pink","red"];
const TYPE_LABEL={kpi:"KPI 指标卡组",cards:"卡片组",rank:"排行榜",table:"明细表",stat:"统计数字卡",text:"文本模块",chart:"图表",gauge:"仪表盘/进度环"};
const CHART_TYPES=["bar","barH","line","area","pie","doughnut","funnel","radar"];
const LS_KEY="dashBuilder_v4";
const CANVAS_W=1200, GRID=10, GAP=16, MINW=200, MINH=120;
const DEF_SIZE={kpi:[1200,190],cards:[1200,480],rank:[590,360],table:[1200,320],stat:[320,170],text:[1200,130],chart:[590,380],gauge:[590,380]};

/* ================= 状态 ================= */
function autoLayout(widgets){
  let x=0,y=0,rowH=0;
  widgets.forEach(w=>{
    if(w.x!==undefined&&w.w) return;
    const [dw,dh]=DEF_SIZE[w.type]||[590,300];
    if(x+dw>CANVAS_W){ x=0; y+=rowH+GAP; rowH=0; }
    w.x=x; w.y=y; w.w=dw; w.h=dh;
    x+=dw+GAP; rowH=Math.max(rowH,dh);
  });
}
function buildExample(){
  const sid=uid("s");
  const F=(name,type)=>({id:uid("f"),name,type});
  const f=[F("门店","text"),F("品牌","text"),F("订单","number"),F("交车","number"),F("待交","number"),F("直销量","number"),F("按揭交车","number")];
  const [nameX,brandX,orderX,carX,pendX,directX,mortX]=f.map(x=>x.id);

function fieldAgg(s,fieldId,agg){ const rows=getFilteredRows(s); const vals=rows.map(r=>num(r[fieldId])); if(agg==="sum")return vals.reduce((a,b)=>a+b,0); if(agg==="avg")return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; if(agg==="count")return vals.length; if(agg==="max")return vals.length?Math.max(...vals):0; if(agg==="min")return vals.length?Math.min(...vals):0; return 0; }
function ratioTotal(s,item){ const rows=getFilteredRows(s); const n=rows.reduce((a,r)=>a+num(r[item.numId]),0),d=rows.reduce((a,r)=>a+num(r[item.denId]),0); return d===0?0:n/d; }
function renderKpi(w,s){ const items=(w.config.items||[]).filter(i=>i.kind==="ratio"?(i.numId&&i.denId):i.fieldId); if(!items.length)return '<div class="empty">KPI 组件暂无有效指标。</div>'; return `<div class="kpi-grid">${items.map(it=>{ const val=it.kind==="field"?fieldAgg(s,it.fieldId,it.aggregate):ratioTotal(s,it); const display=it.isPct?pct(val):(Math.round(val*100)/100); const c="c-"+(it.color||"gray"); return `<div class="kpi ${c}"><div class="k-label">${esc(it.name||fieldName(s,it.fieldId)||"-")}</div><div class="k-value">${esc(display)}</div>${it.note?`<div class="k-sub">${esc(it.note)}</div>`:""}</div>`; }).join("")}</div>`; }

function renderCards(w,s){ const g=w.config.groupFieldId,rows=getFilteredRows(s); if(!rows.length)return '<div class="empty">该数据源暂无数据。</div>'; return `<div class="shop-grid">${rows.map((r,idx)=>{ const color=["teal","purple","orange","green","pink","blue","red"][idx%7]; const tag=w.config.tagFieldId?esc(fieldVal(s,r,w.config.tagFieldId)):""; const numIds=w.config.numFieldIds||[]; const ratioIds=w.config.ratioFieldIds||[]; let nums=numIds.filter(Boolean).map(fid=>{ const v=num(r[fid]); const neg=v<0?"num-neg":""; return `<div class="sn"><span class="l">${esc(fieldName(s,fid))}</span><span class="v ${neg}">${Math.round(v*100)/100}</span></div>`; }).join(""); let ratios=ratioIds.filter(x=>x.numId&&x.denId).map(x=>{ const n=num(r[x.numId]),d=num(r[x.denId]); const v=d===0?0:n/d; const p=Math.min(Math.max(v*100,0),100); return `<div class="sr"><div class="top"><span class="lab">${esc(fieldName(s,x.numId)+" / "+fieldName(s,x.denId))}</span><span class="val">${pct(v)}</span></div><div class="bar bar-${color}"><i style="width:${p}%"></i></div></div>`; }).join(""); return `<div class="shop"><div class="s-head bg-${color}"><span class="s-name">${esc(g?fieldVal(s,r,g):"")}</span>${tag?`<span class="s-brand">${tag}</span>`:""}</div><div class="s-body">${nums?`<div class="s-nums">${nums}</div>`:""}${ratios?`<div class="s-ratios">${ratios}</div>`:""}</div></div>`; }).join("")}</div>`; }
function renderRank(w,s){ const fid=w.config.fieldId; const sRows=getFilteredRows(s); if(!fid)return '<div class="empty">排行榜未配置排序字段。</div>'; const topN=w.config.topN||10,g=w.config.groupFieldId||""; const arr=getFilteredRows(s).slice().sort((a,b)=>num(b[fid])-num(a[fid])); const final=w.config.order==="asc"?arr.slice().reverse().slice(0,topN):arr.slice(0,topN); return `<div class="rank">${final.map((r,i)=>{ const label=g?fieldVal(s,r,g):(Object.keys(r)[0]||""); return `<div class="rk"><span class="idx">${i+1}</span><span class="rk-name">${esc(label)}</span><span class="rk-val">${Math.round(num(r[fid])*100)/100}</span></div>`; }).join("")}</div>`; }
function renderTable(w,s){
  const cols=(w.config.columnIds||[]).filter(Boolean);

  if(sort){ rows=rows.slice().sort((a,b)=>{ const av=fieldVal(s,a,sort.col),bv=fieldVal(s,b,sort.col); const an=num(av),bn=num(bv); const cmp=isNaN(an)||isNaN(bn)?String(av).localeCompare(String(bv)):an-bn; return sort.dir==="desc"?-cmp:cmp; }); }

}

let _charts=[];
function disposeCharts(){ _charts.forEach(c=>{try{c.dispose();}catch(e){}}); _charts=[]; }
function groupByField(s,xFieldId,valueIds){ const map={},order=[]; const rows=getFilteredRows(s); for(const r of rows){ const key=String(r[xFieldId]??""); if(!(key in map)){ map[key]=valueIds.map(()=>0); order.push(key);} valueIds.forEach((fid,i)=>{ map[key][i]+=num(r[fid]); }); } return {labels:order,series:valueIds.map((fid,i)=>order.map(k=>map[k][i]))}; }
function buildChartOption(w,s){ const c=w.config,valueIds=(c.valueFieldIds||[]).filter(Boolean),gt=c.chartType; const palette=["#3b82f6","#22c55e","#f59e0b","#a855f7","#14b8a6","#ec4899","#ef4444","#9aa7b5"];
  if(gt==="pie"||gt==="doughnut"){ const gb=groupByField(s,c.xFieldId,valueIds.slice(0,1)); return {tooltip:{trigger:"item",formatter:"{b}: {c} ({d}%)"},legend:{bottom:0},series:[{type:"pie",radius:gt==="doughnut"?["42%","68%"]:"72%",data:gb.labels.map((l,i)=>({name:l,value:gb.series[0][i]})),color:palette}]}; }
  if(gt==="radar"){ const allMax=Math.max(...s.rows.map(r=>Math.max(...valueIds.map(f=>num(r[f])))),1); return {tooltip:{},legend:{bottom:0},radar:{indicator:valueIds.map(fid=>({name:fieldName(s,fid),max:allMax}))},series:[{type:"radar",data:[{value:valueIds.map(fid=>fieldAgg(s,fid,"sum")),areaStyle:{}}],color:palette}]}; }
  if(gt==="funnel"){ const gb=groupByField(s,c.xFieldId,valueIds.slice(0,1)); const data=gb.labels.map((l,i)=>({name:l,value:gb.series[0][i]})).sort((a,b)=>b.value-a.value); return {tooltip:{trigger:"item",formatter:"{b}: {c}"},series:[{type:"funnel",left:"15%",width:"70%",data,color:palette}]}; }
  const gb=groupByField(s,c.xFieldId,valueIds); const series=valueIds.map((fid,i)=>{ const base={name:fieldName(s,fid),type:(gt==="bar"||gt==="barH")?"bar":"line",data:gb.series[i],itemStyle:{color:palette[i%palette.length]}}; if(gt==="area"){base.areaStyle={opacity:.25};} if(gt==="line"||gt==="area"){base.lineStyle={color:palette[i%palette.length]};} return base; });
  return {tooltip:{trigger:"axis"},legend:{},grid:{left:50,right:20,top:30,bottom:40},xAxis:{type:gt==="barH"?"value":"category",data:gt==="barH"?undefined:gb.labels},yAxis:{type:gt==="barH"?"category":"value",data:gt==="barH"?gb.labels:undefined},series};
}
function drawCharts(){ if(typeof echarts==="undefined"){ document.querySelectorAll("[data-chart]").forEach(el=>{el.outerHTML='<div class="chart-fallback">图表库未加载（需联网）</div>';}); return; }
  document.querySelectorAll("[data-chart]").forEach(el=>{ const w=currentDash().widgets.find(x=>x.id===el.dataset.chart); if(!w)return; const s=getSource(w.sourceId); if(!s)return; const inst=echarts.init(el); _charts.push(inst); inst.setOption(buildChartOption(w,s)); });

/* ================= 拖拽 ================= */
function initDnD(){
  // 拖拽移动（标题栏）
  document.querySelectorAll(".module-bar").forEach(bar=>{
    bar.addEventListener("pointerdown",e=>{
      if(e.target.closest(".m-actions")) return;
      const mod=bar.closest(".module");
      const w=currentDash().widgets.find(x=>x.id===mod.dataset.id);
      if(!w) return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;
      mod.classList.add("dragging");
      function onMove(ev){ const x=Math.max(0,Math.round((ox+ev.clientX-sx)/GRID)*GRID); const y=Math.max(0,Math.round((oy+ev.clientY-sy)/GRID)*GRID); mod.style.left=x+"px"; mod.style.top=y+"px"; mod._dx=x; mod._dy=y; }
      function onUp(){ document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp); mod.classList.remove("dragging"); if(mod._dx!==undefined){ w.x=mod._dx; w.y=mod._dy; delete mod._dx; delete mod._dy; updateCanvasHeight(); saveState(); } }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp);
    });
  });
  // 拖拽缩放（右下角手柄）
  document.querySelectorAll(".resize-h").forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.preventDefault(); e.stopPropagation();
      const mod=h.closest(".module");
      const w=currentDash().widgets.find(x=>x.id===mod.dataset.id);
      if(!w) return;
      const sx=e.clientX,sy=e.clientY,ow=w.w,oh=w.h;
      mod.classList.add("dragging");
      function onMove(ev){ const nw=Math.max(MINW,Math.round((ow+ev.clientX-sx)/GRID)*GRID); const nh=Math.max(MINH,Math.round((oh+ev.clientY-sy)/GRID)*GRID); mod.style.width=nw+"px"; mod.style.height=nh+"px"; mod._nw=nw; mod._nh=nh; }
      function onUp(){ document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp); mod.classList.remove("dragging"); if(mod._nw){ w.w=mod._nw; w.h=mod._nh; delete mod._nw; delete mod._nh; updateCanvasHeight(); saveState(); } }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp);
    });
  });
}

function defaultCfg(type){ switch(type){ case "kpi":return {items:[]}; case "cards":return {groupFieldId:"",tagFieldId:"",numFieldIds:[],ratioFieldIds:[]}; case "rank":return {fieldId:"",order:"desc",topN:5,groupFieldId:""}; case "table":return {columnIds:[]}; case "stat":return {label:"",fieldId:"",aggregate:"sum",suffix:"",color:"blue",isPct:false}; case "text":return {text:"在这里输入文本，支持 &lt;h1&gt;、&lt;b&gt; 等 HTML 标签。"}; case "chart":return {chartType:"bar",xFieldId:"",valueFieldIds:[],aggregate:"sum"}; case "gauge":return {label:"",kind:"field",fieldId:"",aggregate:"sum",max:100,suffix:"",color:"teal"}; } return {}; }

function editWidget(id){ wDraft=JSON.parse(JSON.stringify(currentDash().widgets.find(w=>w.id===id))); showModal("widgetCfgModal"); renderCfg(); }
function renderCfg(){
  document.getElementById("cfgName").value=wDraft.name;
  document.getElementById("cfgName").oninput=e=>wDraft.name=e.target.value;
  const s=getSource(wDraft.sourceId); const fields=s?s.fields:[];
  const fOpt=fid=>fields.map(f=>`<option value="${f.id}" ${fid===f.id?"selected":""}>${esc(f.name)}</option>`).join("");
  const srcSel=`<div class="f-label">数据源</div><div class="cfg-row"><select id="cfgSource">${state.sources.map(x=>`<option value="${x.id}" ${x.id===wDraft.sourceId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`;
  let body="";
  if(wDraft.type==="kpi"){ body=srcSel+`<div class="f-label">指标项</div><div id="kpiItems">${wDraft.config.items.map((it,i)=>`<div class="cfg-item"><div class="cfg-head">指标 ${i+1}<span class="c-del" onclick="delKpiItem(${i})">删除</span></div><div class="cfg-row"><input data-i="${i}" data-k="name" value="${esc(it.name)}" style="width:130px"><select data-i="${i}" data-k="kind"><option value="field" ${it.kind==="field"?"selected":""}>字段聚合</option><option value="ratio" ${it.kind==="ratio"?"selected":""}>比率相除</option></select></div><div class="cfg-row kind-field ${it.kind==="field"?"":"hidden"}"><label>绑定字段</label><select data-i="${i}" data-k="fieldId"><option value="">--</option>${fOpt(it.fieldId)}</select><label>聚合</label><select data-i="${i}" data-k="aggregate">${AGGS.map(a=>`<option ${it.aggregate===a?"selected":""}>${a}</option>`).join("")}</select></div><div class="cfg-row kind-ratio ${it.kind==="ratio"?"":"hidden"}"><label>分子</label><select data-i="${i}" data-k="numId"><option value="">--</option>${fOpt(it.numId)}</select><label>分母</label><select data-i="${i}" data-k="denId"><option value="">--</option>${fOpt(it.denId)}</select></div><div class="cfg-row"><label>颜色</label><select data-i="${i}" data-k="color">${COLORS.map(c=>`<option value="${c}" ${it.color===c?"selected":""}>${c}</option>`).join("")}</select><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-i="${i}" data-k="isPct" ${it.isPct?"checked":""}>百分比</label></div><div class="cfg-row"><label>说明</label><input data-i="${i}" data-k="note" value="${esc(it.note)}" style="flex:1"></div></div>`).join("")}</div><button class="btn sm" onclick="addKpiItem()">+ 新增指标</button>`; }
  else if(wDraft.type==="stat"){ const c=wDraft.config; body=srcSel+`<div class="cfg-row"><label>标签</label><input id="stLabel" value="${esc(c.label||"")}" style="width:180px"></div><div class="cfg-row"><label>数值字段</label><select id="stField"><option value="">--</option>${fOpt(c.fieldId)}</select><label>聚合</label><select id="stAgg">${AGGS.map(a=>`<option ${c.aggregate===a?"selected":""}>${a}</option>`).join("")}</select></div><div class="cfg-row"><label>后缀</label><input id="stSuffix" value="${esc(c.suffix||"")}" style="width:80px"><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="stPct" ${c.isPct?"checked":""}>百分比</label><label>颜色</label><select id="stColor">${COLORS.map(x=>`<option value="${x}" ${c.color===x?"selected":""}>${x}</option>`).join("")}</select></div>`; }
  else if(wDraft.type==="gauge"){ const c=wDraft.config; body=srcSel+`<div class="cfg-row"><label>标签</label><input id="gaLabel" value="${esc(c.label||"")}" style="width:180px"></div><div class="cfg-row"><label>取值方式</label><select id="gaKind"><option value="field" ${c.kind==="field"?"selected":""}>字段聚合</option><option value="ratio" ${c.kind==="ratio"?"selected":""}>比率(分子/分母)</option></select></div><div class="cfg-row kind-field ${c.kind==="field"?"":"hidden"}"><label>字段</label><select id="gaField"><option value="">--</option>${fOpt(c.fieldId)}</select><label>聚合</label><select id="gaAgg">${AGGS.map(a=>`<option ${c.aggregate===a?"selected":""}>${a}</option>`).join("")}</select></div><div class="cfg-row kind-ratio ${c.kind==="ratio"?"":"hidden"}"><label>分子</label><select id="gaNum"><option value="">--</option>${fOpt(c.numId)}</select><label>分母</label><select id="gaDen"><option value="">--</option>${fOpt(c.denId)}</select></div><div class="cfg-row"><label>量程上限</label><input id="gaMax" type="number" value="${c.max||100}" style="width:90px"><label>后缀</label><input id="gaSuffix" value="${esc(c.suffix||"")}" style="width:80px"><label>颜色</label><select id="gaColor">${COLORS.map(x=>`<option value="${x}" ${c.color===x?"selected":""}>${x}</option>`).join("")}</select></div>`; }
  else if(wDraft.type==="chart"){ const c=wDraft.config; body=srcSel+`<div class="cfg-row"><label>图表类型</label><select id="chType">${CHART_TYPES.map(t=>`<option value="${t}" ${c.chartType===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div><div class="cfg-row ch-x ${c.chartType==="radar"?"hidden":""}"><label>X/分类字段</label><select id="chX"><option value="">--</option>${fOpt(c.xFieldId)}</select></div><div class="f-label ch-x ${c.chartType==="radar"?"hidden":""}">数值字段（可多个）</div><div class="ch-x ${c.chartType==="radar"?"hidden":""}">${(c.valueFieldIds||[]).map((fid,i)=>`<div class="cfg-row"><select data-chv="${i}"><option value="">--</option>${fOpt(fid)}</select><span class="fd" onclick="delChartVal(${i})">删除</span></div>`).join("")}</div><button class="btn sm ch-x ${c.chartType==="radar"?"hidden":""}" onclick="addChartVal()">+ 数值字段</button><div class="cfg-row ch-radar ${c.chartType==="radar"?"":"hidden"}"><label>指标字段(雷达)</label><select id="chRadarField"><option value="">--</option>${fOpt(c.valueFieldIds?c.valueFieldIds[0]:"")}</select><button class="btn sm" onclick="addRadarVal()">+ 添加指标</button></div><div id="chRadarList" class="ch-radar ${c.chartType==="radar"?"":"hidden"}">${(c.valueFieldIds||[]).map((fid,i)=>`<div class="cfg-row"><select data-rv="${i}"><option value="">--</option>${fOpt(fid)}</select><span class="fd" onclick="delRadarVal(${i})">删除</span></div>`).join("")}</div>`; }
  else if(wDraft.type==="cards"){ body=srcSel+`<div class="cfg-row"><label>标题字段</label><select id="cGroup"><option value="">--</option>${fOpt(wDraft.config.groupFieldId)}</select><label>标签字段</label><select id="cTag"><option value="">--</option>${fOpt(wDraft.config.tagFieldId)}</select></div><div class="f-label">数值字段</div><div id="cNums">${(wDraft.config.numFieldIds||[]).map((fid,i)=>`<div class="cfg-row"><select data-num="${i}"><option value="">--</option>${fOpt(fid)}</select><span class="fd" onclick="delNumField(${i})">删除</span></div>`).join("")}</div><button class="btn sm" onclick="addNumField()">+ 数值字段</button><div class="f-label">比率进度条</div><div id="cRatios">${(wDraft.config.ratioFieldIds||[]).map((x,i)=>`<div class="cfg-row"><select data-rnum="${i}"><option value="">--分子--</option>${fOpt(x.numId)}</select><span>/</span><select data-rden="${i}"><option value="">--分母--</option>${fOpt(x.denId)}</select><span class="fd" onclick="delRatio(${i})">删除</span></div>`).join("")}</div><button class="btn sm" onclick="addRatio()">+ 比率进度条</button>`; }
  else if(wDraft.type==="rank"){ body=srcSel+`<div class="cfg-row"><label>排序字段</label><select id="rField"><option value="">--</option>${fOpt(wDraft.config.fieldId)}</select><label>排序</label><select id="rOrder"><option value="desc" ${wDraft.config.order==="desc"?"selected":""}>降序</option><option value="asc" ${wDraft.config.order==="asc"?"selected":""}>升序</option></select><label>条数</label><input id="rTop" type="number" value="${wDraft.config.topN}" style="width:70px"></div><div class="cfg-row"><label>名称字段</label><select id="rGroup"><option value="">--</option>${fOpt(wDraft.config.groupFieldId||"")}</select></div>`; }
  else if(wDraft.type==="table"){ body=srcSel+`<div class="f-label">展示字段列</div><div id="tCols">${(wDraft.config.columnIds||[]).map((fid,i)=>`<div class="cfg-row"><select data-col="${i}"><option value="">--</option>${fOpt(fid)}</select><span class="fd" onclick="delCol(${i})">删除</span></div>`).join("")}</div><button class="btn sm" onclick="addCol()">+ 字段列</button>`; }
  else if(wDraft.type==="text"){ body=`<div class="f-label">文本内容（支持 HTML 标签）</div><textarea id="txText" rows="4" style="width:100%">${esc(wDraft.config.text||"")}</textarea>`; }
  document.getElementById("cfgBody").innerHTML=body; bindCfgEvents();
}
function bindCfgEvents(){
  const srcSel=document.getElementById("cfgSource"); if(srcSel)srcSel.addEventListener("change",()=>{wDraft.sourceId=srcSel.value;renderCfg();});
  document.querySelectorAll("#kpiItems [data-k]").forEach(el=>{ const i=+el.dataset.i,k=el.dataset.k; el.addEventListener("change",()=>{ const it=wDraft.config.items[i]; it[k]=el.type==="checkbox"?el.checked:el.value; if(k==="kind"){const item=el.closest(".cfg-item"); item.querySelector(".kind-field").classList.toggle("hidden",it.kind!=="field"); item.querySelector(".kind-ratio").classList.toggle("hidden",it.kind!=="ratio");} }); });
  const stL=document.getElementById("stLabel"); if(stL)stL.oninput=e=>wDraft.config.label=e.target.value; const stF=document.getElementById("stField"); if(stF)stF.onchange=e=>wDraft.config.fieldId=e.target.value; const stA=document.getElementById("stAgg"); if(stA)stA.onchange=e=>wDraft.config.aggregate=e.target.value; const stS=document.getElementById("stSuffix"); if(stS)stS.oninput=e=>wDraft.config.suffix=e.target.value; const stP=document.getElementById("stPct"); if(stP)stP.onchange=e=>wDraft.config.isPct=e.target.checked; const stC=document.getElementById("stColor"); if(stC)stC.onchange=e=>wDraft.config.color=e.target.value;
  const gaK=document.getElementById("gaKind"); if(gaK)gaK.onchange=e=>{wDraft.config.kind=e.target.value; const b=document.querySelector("#cfgBody"); b.querySelector(".kind-field").classList.toggle("hidden",e.target.value!=="field"); b.querySelector(".kind-ratio").classList.toggle("hidden",e.target.value!=="ratio");};
  const gaL=document.getElementById("gaLabel"); if(gaL)gaL.oninput=e=>wDraft.config.label=e.target.value; const gaF=document.getElementById("gaField"); if(gaF)gaF.onchange=e=>wDraft.config.fieldId=e.target.value; const gaA=document.getElementById("gaAgg"); if(gaA)gaA.onchange=e=>wDraft.config.aggregate=e.target.value; const gaN=document.getElementById("gaNum"); if(gaN)gaN.onchange=e=>wDraft.config.numId=e.target.value; const gaD=document.getElementById("gaDen"); if(gaD)gaD.onchange=e=>wDraft.config.denId=e.target.value; const gaM=document.getElementById("gaMax"); if(gaM)gaM.oninput=e=>wDraft.config.max=parseFloat(e.target.value)||100; const gaS=document.getElementById("gaSuffix"); if(gaS)gaS.oninput=e=>wDraft.config.suffix=e.target.value; const gaC=document.getElementById("gaColor"); if(gaC)gaC.onchange=e=>wDraft.config.color=e.target.value;
  const chT=document.getElementById("chType"); if(chT)chT.onchange=e=>{wDraft.config.chartType=e.target.value;renderCfg();}; const chX=document.getElementById("chX"); if(chX)chX.onchange=e=>wDraft.config.xFieldId=e.target.value;
  document.querySelectorAll("#chRadarList [data-rv]").forEach(el=>el.onchange=e=>wDraft.config.valueFieldIds[+el.dataset.rv]=e.target.value); const chRF=document.getElementById("chRadarField"); if(chRF)chRF.onchange=e=>{wDraft.config.valueFieldIds=[e.target.value];renderCfg();};
  document.querySelectorAll("#cNums select").forEach(el=>el.onchange=e=>wDraft.config.numFieldIds[+el.dataset.num]=e.target.value); document.querySelectorAll("#cRatios select").forEach(el=>el.onchange=e=>{const i=el.dataset.rnum!==undefined?+el.dataset.rnum:+el.dataset.rden; const k=el.dataset.rnum!==undefined?"numId":"denId"; wDraft.config.ratioFieldIds[i][k]=e.target.value;});
  const cg=document.getElementById("cGroup"); if(cg)cg.onchange=e=>wDraft.config.groupFieldId=e.target.value; const ct=document.getElementById("cTag"); if(ct)ct.onchange=e=>wDraft.config.tagFieldId=e.target.value;
  const rf=document.getElementById("rField"); if(rf)rf.onchange=e=>wDraft.config.fieldId=e.target.value; const ro=document.getElementById("rOrder"); if(ro)ro.onchange=e=>wDraft.config.order=e.target.value; const rtop=document.getElementById("rTop"); if(rtop)rtop.oninput=e=>wDraft.config.topN=Math.max(1,parseInt(e.target.value)||5); const rgp=document.getElementById("rGroup"); if(rgp)rgp.onchange=e=>wDraft.config.groupFieldId=e.target.value;
  document.querySelectorAll("#tCols select").forEach(el=>el.onchange=e=>wDraft.config.columnIds[+el.dataset.col]=e.target.value);
  const txt=document.getElementById("txText"); if(txt)txt.oninput=e=>wDraft.config.text=e.target.value;
}

function openWidgets(){ showModal("widgetModal"); const dash=currentDash(); document.getElementById("widgetList").innerHTML=dash.widgets.map(w=>`<div class="cfg-item"><div class="cfg-head"><span>${esc(w.name)} <span style="color:var(--sub);font-weight:400">(${TYPE_LABEL[w.type]||w.type})</span></span><span style="display:flex;gap:8px"><span class="c-del" onclick="moveWidget('${w.id}',-1)">上移</span><span class="c-del" onclick="moveWidget('${w.id}',1)">下移</span><span class="c-del" onclick="toggleWidgetVis('${w.id}');openWidgets()">${w.hidden?'显示':'隐藏'}</span><span class="c-del" onclick="editWidget('${w.id}')">配置</span><span class="c-del" onclick="delWidget('${w.id}')">删除</span></span></div><div style="font-size:12px;color:var(--sub)${w.hidden?';opacity:.5':''}">数据源：${esc(getSource(w.sourceId)?getSource(w.sourceId).name:"(未绑定)")} · 位置 (${w.x},${w.y}) · ${w.w}×${w.h}</div></div>`).join("")||'<div class="empty">当前看板暂无组件。</div>'; }

let srcDraft=null,curSrcId=null;
function openSources(){ srcDraft=JSON.parse(JSON.stringify(state.sources)); curSrcId=srcDraft.length?srcDraft[0].id:null; renderSrcList(); renderSrcEditor(); showModal("srcModal"); }
function renderSrcList(){ document.getElementById("srcList").innerHTML=srcDraft.map(s=>`<div class="sl-item ${s.id===curSrcId?"active":""}" onclick="selectSrc('${s.id}')"><span>${esc(s.name)}</span><span class="d" onclick="event.stopPropagation();delSource('${s.id}')">删除</span></div>`).join(""); }
function selectSrc(id){ curSrcId=id; renderSrcList(); renderSrcEditor(); }
function addSource(){ const s={id:uid("s"),name:"数据源"+(srcDraft.length+1),fields:[],rows:[]}; srcDraft.push(s); curSrcId=s.id; renderSrcList(); renderSrcEditor(); }
function delSource(id){ srcDraft=srcDraft.filter(s=>s.id!==id); curSrcId=srcDraft.length?srcDraft[0].id:null; renderSrcList(); renderSrcEditor(); }
function curSrc(){ return srcDraft.find(s=>s.id===curSrcId); }
function renderSrcEditor(){ const box=document.getElementById("srcEditor"),s=curSrc(); if(!s){box.innerHTML='<div class="empty">请选择或新建数据源。</div>';return;} const fieldsHtml=s.fields.map((f,i)=>`<div class="field-row"><input data-fi="${i}" data-k="name" value="${esc(f.name)}" placeholder="字段名" style="width:160px"><select data-fi="${i}" data-k="type"><option value="number" ${f.type==="number"?"selected":""}>数字</option><option value="text" ${f.type==="text"?"selected":""}>文本</option></select><span class="fd" onclick="delField(${i})">删除</span></div>`).join(""); const cols=s.fields; const tableHtml=cols.length?`<table class="data"><thead><tr>${cols.map(f=>`<th>${esc(f.name)}</th>`).join("")}<th></th></tr></thead><tbody>${s.rows.map((r,ri)=>`<tr data-r="${ri}">${cols.map(f=>`<td><input data-r="${ri}" data-f="${f.id}" value="${esc(r[f.id]??"")}"></td>`).join("")}<td><span class="fd" onclick="delRow(${ri})">删除</span></td></tr>`).join("")}</tbody></table>`:'<div class="hint">该数据源暂无字段，请先添加字段模板。</div>'; box.innerHTML=`<div class="f-label">数据源名称</div><div class="cfg-row"><input id="srcName" value="${esc(s.name)}" style="width:220px"></div><div class="f-label">字段模板（自定义结构）</div><div id="fieldList">${fieldsHtml}</div><button class="btn sm" onclick="addField()">+ 添加字段</button><div class="f-label">数据记录</div>${tableHtml}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn sm" onclick="addRow()">+ 新增行</button><button class="btn sm" onclick="importToSource('${s.id}')">导入 Excel/CSV</button><button class="btn sm" onclick="pasteToSource('${s.id}')">粘贴数据</button></div>`; document.getElementById("srcName").addEventListener("input",e=>s.name=e.target.value); document.querySelectorAll("#fieldList [data-fi]").forEach(el=>el.addEventListener("input",()=>{const f=s.fields[+el.dataset.fi];f[el.dataset.k]=el.value;})); document.querySelectorAll("#srcEditor table.data input").forEach(el=>el.addEventListener("input",()=>{s.rows[+el.dataset.r][el.dataset.f]=el.value;})); }
function addField(){ const s=curSrc(); s.fields.push({id:uid("f"),name:"新字段",type:"number"}); renderSrcEditor(); }
function delField(i){ const s=curSrc(); const fid=s.fields[i].id; s.fields.splice(i,1); s.rows.forEach(r=>delete r[fid]); renderSrcEditor(); }
function addRow(){ const s=curSrc(); const r={}; s.fields.forEach(f=>r[f.id]=""); s.rows.push(r); renderSrcEditor(); }
function delRow(i){ curSrc().rows.splice(i,1); renderSrcEditor(); }
function saveSources(){ state.sources=srcDraft; saveState(); closeModal("srcModal"); render(); toast("数据源已保存"); }
function importToSource(id){ const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls,.csv,.tsv"; inp.onchange=()=>{ const file=inp.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=e=>{ const data=new Uint8Array(e.target.result); let rows; if(typeof XLSX!=="undefined"){ const wb=XLSX.read(data,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(ws,{defval:""}); } else { toast("Excel 解析库未加载（需联网），请使用粘贴方式"); return; } applyImportRows(id,rows); }; reader.readAsArrayBuffer(file); }; inp.click(); }
function applyImportRows(id,rows){ const s=srcDraft.find(x=>x.id===id); if(!rows||!rows.length){toast("数据为空");return;} const head=Object.keys(rows[0]); const fidMap={}; head.forEach(h=>{ let f=s.fields.find(x=>x.name===h); if(!f){f={id:uid("f"),name:h,type:"number"};s.fields.push(f);} fidMap[h]=f.id; }); s.rows=rows.map(o=>{ const r={}; head.forEach(h=>{r[fidMap[h]]=o[h];}); return r; }); renderSrcEditor(); toast("已导入 "+rows.length+" 行"); }
function pasteToSource(id){ const txt=prompt("粘贴 CSV/TSV 数据（首行为字段名）:"); if(!txt)return; const delim=txt.includes("\t")?"\t":","; const lines=txt.split(/\r?\n/).filter(l=>l.trim()!==""); if(lines.length<2){toast("数据不足");return;} const head=lines[0].split(delim).map(h=>h.trim()); const rows=lines.slice(1).map(l=>{ const c=l.split(delim); const o={}; head.forEach((h,j)=>{ let v=c[j]?.trim()??""; const n=Number(v); o[h]=(v!==""&&!isNaN(n)&&/^[-\d.]+$/.test(v))?n:v; }); return o; }); applyImportRows(id,rows); }

let filterState = {};
function toggleFilterBar() {
  const bar = document.getElementById("filterBar");
  bar.classList.toggle("hidden");
  if (!bar.classList.contains("hidden")) {
    const sel = document.getElementById("filterSource");
    sel.innerHTML = '<option value="">选择数据源</option>' + state.sources.map(s => '<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
    if (filterState.sourceId) { sel.value = filterState.sourceId; renderFilterFields(); }
  }
}
function renderFilterFields() {
  const sid = document.getElementById("filterSource").value;
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>';
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  if (!sid) return;
  const s = getSource(sid); if (!s) return;
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>' + s.fields.map(f => '<option value="'+f.id+'">'+esc(f.name)+'</option>').join("");
  filterState.sourceId = sid;
}
function renderFilterValues() {
  const fid = document.getElementById("filterField").value;
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  if (!fid) return;
  const s = getSource(filterState.sourceId); if (!s) return;
  const vals = [...new Set(s.rows.map(r => String(r[fid] ?? "")))].sort();
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>' + vals.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
  filterState.fieldId = fid;
}
function applyFilter() {
  filterState.value = document.getElementById("filterValue").value || "";
  renderFilterTags(); render();
}
function clearFilter() {
  filterState = {};
  document.getElementById("filterSource").value = "";
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>';
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  renderFilterTags(); render();
}
function renderFilterTags() {
  const box = document.getElementById("filterTags");
  if (!filterState.sourceId || !filterState.fieldId) { box.innerHTML = ""; return; }
  const s = getSource(filterState.sourceId);
  const fn = s ? fieldName(s, filterState.fieldId) : "";
  box.innerHTML = '<span class="f-tag">'+esc(fn)+' = '+esc(filterState.value || "全部")+' <span class="x" onclick="clearFilter()">&times;</span></span>';
}
function getFilteredRows(s) {
  if (!filterState.sourceId || filterState.sourceId !== s.id || !filterState.fieldId || !filterState.value) return s.rows;
  return s.rows.filter(r => String(r[filterState.fieldId] ?? "") === filterState.value);
}
/* ================= 主题切换 ================= */
function toggleTheme() {
  document.body.classList.toggle("dark");
  try { localStorage.setItem("dashTheme", document.body.classList.contains("dark") ? "dark" : "light"); } catch(e) {}
  setTimeout(() => { drawCharts(); }, 100);
}
(function loadTheme() {
  try { if (localStorage.getItem("dashTheme") === "dark") document.body.classList.add("dark"); } catch(e) {}
})();
/* ================= 导出图片 ================= */
async function exportImage() {
  toast("正在生成截图...");
  const canvas = document.getElementById("canvas");
  const actions = canvas.querySelectorAll(".m-actions, .resize-h");
  actions.forEach(a => a.style.display = "none");
  try {
    if (typeof html2canvas === "undefined") {
      await new Promise((res, rej) => {
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
        sc.onload = res; sc.onerror = rej;
        document.head.appendChild(sc);
      });
    }
    if (typeof html2canvas === "undefined") throw new Error("not loaded");
    const el = await html2canvas(canvas, {backgroundColor: getComputedStyle(document.body).backgroundColor, scale: 2});
    const link = document.createElement("a");
    link.download = (currentDash().name || "kanban") + ".png";
    link.href = el.toDataURL("image/png");
    link.click();
    toast("截图已保存");
  } catch(e) {
    toast("截图库需联网，可用 Ctrl+P 打印为PDF替代");
  }
  actions.forEach(a => a.style.display = "");
}
/* ================= 导出/导入配置 ================= */
function exportJSON() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const link = document.createElement("a");
  link.download = "kanban_config.json";
  link.href = URL.createObjectURL(blob);
  link.click();
  toast("配置已导出");
}
function importJSON() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try { const data = JSON.parse(e.target.result);
        if (!data.dashboards) { toast("文件格式不正确"); return; }
        state = migrate(data); saveState(); render(); toast("配置已导入");
      } catch(err) { toast("解析失败"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}
/* ================= 组件显隐 ================= */
function toggleWidgetVis(id) {
  const w = currentDash().widgets.find(x => x.id === id);
  if (!w) return;
  w.hidden = !w.hidden;
  saveState(); render();
}

let tableSearchState = {};
