<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用数据看板构建器</title>
<style>
  :root{
    --bg:#eef3fb; --card:#fff; --ink:#1f2d3d; --sub:#8a97a8; --line:#e7edf5;
    --blue:#3b82f6; --green:#22c55e; --gray:#9aa7b5; --purple:#a855f7;
    --teal:#14b8a6; --orange:#f59e0b; --pink:#ec4899; --red:#ef4444; --grid-line:rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);padding:20px 24px 48px;}
  .page{max-width:1240px;margin:0 auto;}
  .hidden{display:none !important;}

  .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  .header .title{font-size:20px;font-weight:700;}
  .header .sub{font-size:12px;font-weight:400;color:var(--sub);margin-top:3px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{border:none;cursor:pointer;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(30,50,80,.1);transition:.15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(30,50,80,.15);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);}
  .btn.sm{padding:5px 10px;font-size:12px;}

  /* 看板页签栏 */
  .tabs-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgba(30,50,80,.06);margin-bottom:14px;overflow-x:auto;}
  .tabs-label{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap;}
  .dash-tabs{display:flex;gap:6px;align-items:center;flex:1;}
  .dash-tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;border:1px solid transparent;}
  .dash-tab:hover{background:#f2f6fb;}
  .dash-tab.active{background:#e8f0fe;color:var(--blue);font-weight:600;}
  .dash-tab .menu-btn{opacity:0;cursor:pointer;font-size:14px;color:var(--sub);padding:0 2px;border:none;background:none;}
  .dash-tab:hover .menu-btn,.dash-tab.active .menu-btn{opacity:1;}
  .dash-add{font-size:18px;font-weight:600;color:var(--sub);cursor:pointer;padding:4px 10px;border-radius:8px;white-space:nowrap;}
  .dash-add:hover{background:#f2f6fb;color:var(--blue);}
  .menu{position:fixed;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;z-index:120;min-width:130px;}
  .menu .mi{padding:8px 12px;font-size:13px;cursor:pointer;border-radius:7px;}
  .menu .mi:hover{background:#f2f6fb;}
  .menu .mi.danger{color:var(--red);}

  /* 画布（自由布局容器） */
  #canvas{position:relative;margin:0 auto;background:#f6f9fd;border-radius:14px;padding:16px;min-height:420px;}
  .module{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(30,50,80,.08);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);}
  .module.dragging{box-shadow:0 10px 30px rgba(30,50,80,.2);z-index:10;}
  .module-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:move;user-select:none;border-bottom:1px solid var(--line);background:#fafcff;flex-shrink:0;}
  .module-bar .m-title{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .module-bar .m-type{font-size:11px;color:var(--sub);font-weight:400;white-space:nowrap;}
  .m-actions{display:flex;gap:4px;}
  .m-actions .btn{box-shadow:none;background:#f2f6fb;padding:3px 8px;font-size:11px;line-height:1.4;}
  .module-body{flex:1;overflow:auto;padding:12px;}
  .resize-h{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5;}
  .resize-h::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-right:2px solid #c3ccd8;border-bottom:2px solid #c3ccd8;border-radius:0 0 3px 0;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .kpi{background:#f8fafc;border-radius:12px;padding:14px 16px;border-left:4px solid var(--gray);}
  .kpi .k-label{font-size:12px;color:var(--sub);margin-bottom:8px;}
  .kpi .k-value{font-size:26px;font-weight:700;line-height:1;}
  .kpi .k-sub{font-size:11px;color:var(--sub);margin-top:8px;}
  .c-blue{border-left-color:var(--blue);} .c-blue .k-value{color:var(--blue);}
  .c-green{border-left-color:var(--green);} .c-green .k-value{color:var(--green);}
  .c-gray{border-left-color:var(--gray);}
  .c-purple{border-left-color:var(--purple);} .c-purple .k-value{color:var(--purple);}
  .c-teal{border-left-color:var(--teal);} .c-teal .k-value{color:var(--teal);}
  .c-orange{border-left-color:var(--orange);} .c-orange .k-value{color:var(--orange);}
  .c-pink{border-left-color:var(--pink);} .c-pink .k-value{color:var(--pink);}
  .c-red{border-left-color:var(--red);} .c-red .k-value{color:var(--red);}
  .stat{background:#f8fafc;border-radius:12px;padding:16px;border-left:4px solid var(--gray);}
  .stat .s-label{font-size:12px;color:var(--sub);margin-bottom:10px;}
  .stat .s-value{font-size:30px;font-weight:700;line-height:1;}
  .stat .s-suffix{font-size:15px;color:var(--sub);margin-left:4px;font-weight:600;}

  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .shop{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px rgba(30,50,80,.06);transition:.2s;}
  .shop:hover{box-shadow:0 6px 20px rgba(30,50,80,.12);transform:translateY(-2px);}
  .shop .s-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  .shop .s-head .s-name{font-size:16px;font-weight:700;}
  .shop .s-head .s-brand{font-size:11px;background:rgba(0,0,0,.06);padding:3px 10px;border-radius:12px;font-weight:600;}
  .shop .s-body{padding:14px 16px;}
  .shop .s-nums{display:flex;gap:16px;margin-bottom:12px;}
  .shop .s-nums .sn{flex:1;text-align:center;}
  .shop .s-nums .sn .v{font-size:24px;font-weight:700;display:block;line-height:1.1;}
  .shop .s-nums .sn .l{font-size:11px;color:var(--sub);margin-top:4px;display:block;}
  .shop .s-ratios{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;}
  .shop .sr{display:inline-flex;align-items:baseline;gap:4px;font-size:12px;}
  .shop .sr .lab{color:var(--sub);}
  .shop .sr .pill{font-weight:700;padding:2px 10px;border-radius:12px;font-size:12px;}
  .shop .sr .pill.blue{background:#e8f0fe;color:var(--blue);}
  .shop .sr .pill.teal{background:#e0f7f4;color:var(--teal);}
  .shop .sr .pill.purple{background:#f3e8ff;color:var(--purple);}
  .shop .sr .pill.orange{background:#fef3e0;color:var(--orange);}
  .shop .sr .pill.green{background:#e8f8ee;color:var(--green);}
  .shop .sr .pill.pink{background:#fce4f0;color:var(--pink);}
  .shop .sr .pill.red{background:#fee2e2;color:var(--red);}
  .shop .sr .pill.gray{background:#f0f2f5;color:var(--gray);}
  .shop .s-tag{font-size:12px;font-weight:600;margin-bottom:8px;}
  .shop .s-tag.blue{color:var(--blue);} .shop .s-tag.teal{color:var(--teal);} .shop .s-tag.purple{color:var(--purple);} .shop .s-tag.orange{color:var(--orange);} .shop .s-tag.green{color:var(--green);} .shop .s-tag.pink{color:var(--pink);} .shop .s-tag.red{color:var(--red);} .shop .s-tag.gray{color:var(--gray);}
  .shop .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;}
  .shop .bar i{display:block;height:100%;border-radius:4px;}

  /* 指标板组件 */
  .metric-panel{display:flex;flex-direction:column;gap:0;height:100%;}
  .mp-header{font-size:15px;font-weight:700;padding:0 0 12px 0;display:flex;align-items:center;gap:8px;}
  .mp-header .mp-icon{width:8px;height:24px;border-radius:4px;}
  .mp-nums{display:flex;gap:20px;flex-wrap:wrap;padding:4px 0 16px 0;border-bottom:1px solid var(--line);}
  .mp-nums .mp-item{text-align:left;flex:1;min-width:80px;}
  .mp-nums .mp-item .v{font-size:28px;font-weight:700;display:block;line-height:1;}
  .mp-nums .mp-item .l{font-size:12px;color:var(--sub);margin-top:5px;display:block;}
  .mp-nums .mp-item .sfx{font-size:14px;color:var(--sub);font-weight:600;margin-left:3px;}
  .mp-ratios{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);}
  .mp-ratios .mp-r{display:flex;align-items:baseline;gap:5px;font-size:13px;}
  .mp-ratios .mp-r .lab{color:var(--sub);}
  .mp-ratios .mp-r .pill{font-weight:700;padding:2px 10px;border-radius:12px;font-size:13px;}
  .mp-progs{display:flex;flex-direction:column;gap:10px;padding:12px 0 0 0;flex:1;}
  .mp-progs .mp-p{}
  .mp-progs .mp-p .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .mp-progs .mp-p .top .lab{color:var(--sub);}
  .mp-progs .mp-p .top .val{font-weight:700;}
  .mp-progs .mp-p .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;}
  .mp-progs .mp-p .bar i{display:block;height:100%;border-radius:4px;}
  .mp-agg{font-size:11px;color:var(--sub);text-align:right;margin-top:6px;}

  /* 配置面板 Tab */
  .cfg-tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;}
  .cfg-tab{padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;color:var(--sub);}
  .cfg-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .cfg-tab:hover{color:var(--blue);}
  .cfg-panel{display:none;}
  .cfg-panel.active{display:block;}
  .num-neg{color:var(--red);}
  .bg-blue{background:var(--blue);} .bar-blue i{background:var(--blue);}
  .bg-teal{background:var(--teal);} .bar-teal i{background:var(--teal);}
  .bg-purple{background:var(--purple);} .bar-purple i{background:var(--purple);}
  .bg-orange{background:var(--orange);} .bar-orange i{background:var(--orange);}
  .bg-green{background:var(--green);} .bar-green i{background:var(--green);}
  .bg-pink{background:var(--pink);} .bar-pink i{background:var(--pink);}
  .bg-red{background:var(--red);} .bar-red i{background:var(--red);}

  .rank{background:#f8fafc;border-radius:12px;padding:4px 0;}
  .rank .rk{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);}
  .rank .rk:last-child{border-bottom:none;}
  .rank .rk .idx{width:24px;height:24px;border-radius:7px;background:#eef2f7;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .rank .rk:nth-child(1) .idx{background:#ffd76e;color:#7a5a00;}
  .rank .rk:nth-child(2) .idx{background:#cfd6e0;color:#4a5568;}
  .rank .rk:nth-child(3) .idx{background:#e8b48c;color:#7a4a20;}
  .rank .rk .rk-name{flex:1;font-size:13px;}
  .rank .rk .rk-val{font-size:15px;font-weight:700;}

  table.detail{width:100%;border-collapse:collapse;font-size:12px;}
  table.detail th,table.detail td{border:1px solid var(--line);padding:7px 10px;text-align:center;}
  table.detail th{background:#f5f8fc;font-weight:600;}

  .chart-el{width:100%;height:100%;min-height:200px;}
  .chart-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;}
  .text-mod{font-size:14px;line-height:1.7;}
  .empty{background:var(--card);border-radius:12px;padding:30px;text-align:center;color:var(--sub);box-shadow:0 2px 10px rgba(30,50,80,.06);}
  .canvas-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;}

  .modal-mask{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:50;overflow:auto;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:960px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-size:16px;font-weight:700;}
  .modal-head .x{cursor:pointer;font-size:22px;color:var(--sub);line-height:1;}
  .modal-body{padding:18px 24px;max-height:74vh;overflow:auto;}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
  .split{display:grid;grid-template-columns:220px 1fr;gap:18px;}
  .sidelist{border-right:1px solid var(--line);padding-right:14px;}
  .sidelist .sl-item{padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
  .sidelist .sl-item.active{background:#e8f0fe;color:var(--blue);font-weight:600;}
  .sidelist .sl-item .d{color:var(--red);cursor:pointer;font-weight:400;font-size:12px;}
  .f-label{font-size:13px;font-weight:600;margin:14px 0 8px;}
  .field-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .field-row input,.field-row select,.cfg-row input,.cfg-row select,.cfg-row textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;}
  .cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .cfg-row label{font-size:13px;color:var(--sub);min-width:72px;}
  .cfg-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfcfe;}
  .cfg-item .cfg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:13px;}
  .cfg-item .cfg-head .c-del{color:var(--red);cursor:pointer;font-size:12px;}
  .field-row .fd,.cfg-item .fd{color:var(--red);cursor:pointer;font-size:13px;}
  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th,table.data td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  table.data th{background:#f5f8fc;font-weight:600;}
  table.data input{width:100%;border:none;text-align:center;font-size:13px;outline:none;background:transparent;}
  .hint{font-size:12px;color:var(--sub);margin:6px 0 14px;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;}
  /* 深色主题 */
  body.dark{--bg:#1a1f2e;--card:#252b3d;--ink:#e4e8f0;--sub:#7a85a0;--line:#384055;}
  body.dark .module-bar{background:#2a3045;}
  body.dark .kpi,body.dark .stat,body.dark .shop{background:#2a3045;}
  body.dark .rank{background:#2a3045;}
  body.dark .rank .rk{border-color:#384055;}
  body.dark table.detail th{background:#2a3045;}
  body.dark .m-actions .btn{background:#2a3045;}
  body.dark #canvas{background:#1e2333;}
  body.dark .shop .sr .pill.blue{background:#1e3a5e;}
  body.dark{--grid-line:rgba(255,255,255,.07);}
  #canvas.grid-on{background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-repeat:repeat;}
  .th-opt{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:10px;cursor:pointer;border:2px solid transparent;width:92px;}
  .th-opt i{width:100%;height:42px;border-radius:6px;display:block;}
  .th-opt span{font-size:11px;color:var(--sub);}
  .th-opt:hover{transform:translateY(-1px);}
  .th-opt.sel{border-color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .mp-item .cmp{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;}
  .mp-item .cmp.up{color:#22c55e;}
  .mp-item .cmp.down{color:#ef4444;}
  body.dark .shop .sr .pill.teal{background:#0e3a36;}
  body.dark .shop .sr .pill.purple{background:#2e1f4a;}
  body.dark .shop .sr .pill.orange{background:#3e2e15;}
  body.dark .shop .sr .pill.green{background:#1a3a26;}
  body.dark .shop .sr .pill.pink{background:#3e1e30;}
  body.dark .shop .sr .pill.red{background:#3e1e1e;}
  body.dark .shop .sr .pill.gray{background:#2a3045;}
  body.dark .mp-ratios .mp-r .pill.blue{background:#1e3a5e;} body.dark .mp-ratios .mp-r .pill.teal{background:#0e3a36;}
  body.dark .mp-ratios .mp-r .pill.purple{background:#2e1f4a;} body.dark .mp-ratios .mp-r .pill.orange{background:#3e2e15;}
  body.dark .mp-ratios .mp-r .pill.green{background:#1a3a26;} body.dark .mp-ratios .mp-r .pill.pink{background:#3e1e30;}
  body.dark .mp-ratios .mp-r .pill.red{background:#3e1e1e;} body.dark .mp-ratios .mp-r .pill.gray{background:#2a3045;}
  body.dark .cfg-tab{color:#7a85a0;}




  /* 标题/分隔线组件 */
  .divider-mod{width:100%;height:100%;display:flex;align-items:center;gap:12px;padding:0 6px;}
  .divider-mod .dv-bar{width:6px;height:28px;border-radius:3px;flex-shrink:0;}
  .divider-mod .dv-title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .divider-mod .dv-line{flex:1;height:1px;background:var(--line);}
  /* 词云图 */
  .wc-mod{width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px;}
  .wc-mod .wc-word{font-weight:700;cursor:default;transition:.15s;line-height:1;}
  .wc-mod .wc-word:hover{transform:scale(1.1);}

  /* 图片/按钮/进度图组件 */
  .img-mod{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;}
  .img-mod img{max-width:100%;max-height:100%;border-radius:8px;}
  .btn-mod{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .btn-mod a{text-decoration:none;display:inline-block;color:#fff;border-radius:8px;padding:12px 26px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(30,50,80,.15);transition:.15s;cursor:pointer;}
  .btn-mod a:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,50,80,.2);}
  .prog-mod{width:100%;height:100%;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .prog-mod .pg-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;}
  .prog-mod .pg-row .pg-lab{color:var(--sub);}
  .prog-mod .pg-row .pg-val{font-weight:700;font-size:18px;}
  .prog-mod .bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden;}
  .prog-mod .bar i{display:block;height:100%;border-radius:8px;transition:width .4s;}

  /* 颜色选择器（WPS仪表盘式） */
  .color-picker{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);transition:.15s;vertical-align:middle;}
  .color-picker:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .cp-swatch{width:18px;height:18px;border-radius:5px;display:inline-block;flex-shrink:0;}
  .cp-pop{position:fixed;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;z-index:300;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .cp-pop .cpc{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.1s;box-sizing:border-box;}
  .cp-pop .cpc:hover{transform:scale(1.15);}
  .cp-pop .cpc.sel{border-color:#333;box-shadow:0 0 0 2px #fff inset;}
  body.dark .cp-pop{background:#252b3d;}
  body.dark .cp-pop .cpc.sel{border-color:#fff;}

  /* 全局筛选器 */
  .filter-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(30,50,80,.06);margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar .f-label2{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap;}
  .filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:var(--card);color:var(--ink);}
  .filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue);}
  .filter-bar .f-tag{display:inline-flex;align-items:center;gap:6px;background:#e8f0fe;color:var(--blue);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
  body.dark .filter-bar .f-tag{background:#2a3a5e;}
  .filter-bar .f-tag .x{cursor:pointer;font-size:14px;}

  /* 对齐线 */
  .align-line{position:absolute;background:var(--blue);pointer-events:none;z-index:100;opacity:.7;}
  .align-line.h{height:1px;left:0;right:0;}
  .align-line.v{width:1px;top:0;bottom:0;}

  /* 组件隐藏标记 */
  .module.hidden-w{display:none;}
  .module-bar .vis-btn{cursor:pointer;font-size:14px;opacity:.5;}
  .module-bar .vis-btn:hover{opacity:1;}

  /* 表格搜索/排序 */
  .table-tools{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .table-tools input{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;outline:none;background:var(--card);color:var(--ink);flex:1;max-width:220px;}
  table.detail th.sortable{cursor:pointer;user-select:none;}
  table.detail th.sortable:hover{color:var(--blue);}
  table.detail th .sort-arrow{font-size:10px;margin-left:2px;}

  @media(max-width:900px){
    .module{position:static;width:100% !important;height:auto !important;margin-bottom:14px;}
    .resize-h{display:none;}
    #canvas{min-height:auto;}
  }
  .bg-row{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .bg-opt{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.12s;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#9aa7b5;}
  .bg-opt:hover{transform:scale(1.12);}
  .bg-opt.sel{border-color:#333;box-shadow:0 0 0 2px #fff inset;}
  body.dark .bg-opt.sel{border-color:#fff;box-shadow:0 0 0 2px #252b3d inset;}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div>
      <div class="title" id="appTitle">通用数据看板</div>
      <div class="sub" id="appSub"></div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="openSources()">数据源管理</button>
      <button class="btn" onclick="openWidgets()">组件管理</button>
      <button class="btn primary" onclick="addWidgetMenu()">+ 添加组件</button>
      <button class="btn" onclick="openDashSettings()">看板设置</button>
      <button class="btn" onclick="toggleFilterBar()">筛选</button>
      <button class="btn" onclick="toggleTheme()">主题</button>
      <button class="btn" onclick="exportImage()">导出图片</button>
      <button class="btn ghost" onclick="exportJSON()">导出配置</button>
      <button class="btn ghost" onclick="importJSON()">导入配置</button>
      <button class="btn ghost" onclick="loadExample()">载入示例</button>
      <button class="btn ghost" onclick="resolveOverlaps()">整理布局</button>
      <button class="btn ghost" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="tabs-wrap">
    <span class="tabs-label">看板</span>
    <div class="dash-tabs" id="dashTabs"></div>
    <span class="dash-add" onclick="addDashboard()" title="新建看板">+ 新建看板</span>
  </div>

  <!-- 全局筛选器 -->
  <div class="filter-bar hidden" id="filterBar">
    <span class="f-label2">全局筛选</span>
    <select id="filterSource" onchange="renderFilterFields()"><option value="">选择数据源</option></select>
    <select id="filterField" onchange="renderFilterValues()"><option value="">选择字段</option></select>
    <select id="filterOp" onchange="applyFilter()"><option value="eq">等于</option><option value="neq">不等于</option><option value="contains">包含</option><option value="notContains">不包含</option><option value="gt">大于</option><option value="gte">大于等于</option><option value="lt">小于</option><option value="lte">小于等于</option><option value="isEmpty">为空</option><option value="notEmpty">不为空</option></select>
    <select id="filterValue" onchange="applyFilter()"><option value="">全部</option></select>
    <button class="btn sm" onclick="clearFilter()">清除筛选</button>
    <span id="filterTags"></span>
  </div>

  <div id="canvas"></div>

</div>

<div class="modal-mask hidden" id="typeModal">
  <div class="modal" style="max-width:720px">
    <div class="modal-head"><h3>选择组件类型</h3><span class="x" onclick="closeModal('typeModal')">&times;</span></div>
    <div class="modal-body" id="typeList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;"></div>
  </div>
</div>

<div class="modal-mask hidden" id="srcModal">
  <div class="modal">
    <div class="modal-head"><h3>数据源管理（全局共享）</h3><span class="x" onclick="closeModal('srcModal')">&times;</span></div>
    <div class="modal-body"><div class="split"><div class="sidelist"><div class="f-label">数据源列表</div><div id="srcList"></div><button class="btn sm" onclick="addSource()">+ 新建数据源</button></div><div id="srcEditor"></div></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('srcModal')">取消</button><button class="btn primary" onclick="saveSources()">保存全部</button></div>
  </div>
</div>

<div class="modal-mask hidden" id="widgetModal">
  <div class="modal">
    <div class="modal-head"><h3>组件管理（当前看板）</h3><span class="x" onclick="closeModal('widgetModal')">&times;</span></div>
    <div class="modal-body"><div id="widgetList"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('widgetModal')">关闭</button></div>
  </div>
</div>

<div class="modal-mask hidden" id="widgetCfgModal">
  <div class="modal">
    <div class="modal-head"><h3>组件配置</h3><span class="x" onclick="closeModal('widgetCfgModal')">&times;</span></div>
    <div class="modal-body"><div class="cfg-row" style="margin-bottom:6px"><input id="cfgName" placeholder="组件名称" style="flex:1;font-weight:600"></div><div class="cfg-tabs" id="cfgTabs"></div><div id="cfgBody"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('widgetCfgModal')">取消</button><button class="btn primary" onclick="saveWidget()">保存配置</button></div>
  </div>
</div>

<div class="modal-mask hidden" id="dashSetModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-head"><h3>看板设置</h3><span class="x" onclick="closeModal('dashSetModal')">&times;</span></div>
    <div class="modal-body">
      <div class="f-label">看板标题</div>
      <div class="cfg-row"><input id="dsTitle" placeholder="看板标题" style="flex:1"></div>
      <div class="f-label">副标题</div>
      <div class="cfg-row"><input id="dsSub" placeholder="副标题" style="flex:1"></div>
      <div class="f-label">背景色</div>
      <div class="cfg-row"><input id="dsBg" type="color" style="width:50px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px"><span style="font-size:12px;color:var(--sub)">选择背景色（默认为系统主题）</span></div>
      <div class="f-label">配色主题</div>
      <div class="cfg-row"><div id="dsThemeRowWrap"></div></div>
      <div class="f-label">背景图片（URL，可选）</div>
      <div class="cfg-row"><input id="dsBgImg" placeholder="https://example.com/bg.jpg" style="flex:1"></div>
      <div class="f-label">辅助网格</div>
      <div class="cfg-row"><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="dsGrid">显示网格</label><label style="display:flex;align-items:center;gap:4px;margin-left:12px">大小<input id="dsGridSize" type="number" min="10" max="60" style="width:64px"></label></div>
      <div class="f-label">导出图片倍率</div>
      <div class="cfg-row"><select id="dsExportScale"><option value="1">1x 标准</option><option value="2">2x 高清</option><option value="3">3x 超清</option></select><span style="font-size:11px;color:var(--sub)">倍率越高，导出越清晰</span></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal('dashSetModal')">取消</button><button class="btn primary" onclick="saveDashSettings()">保存</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
/* ================= 帮助函数 ================= */
function uid(p){ return (p||"x")+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function num(v){ let n=parseFloat(v); return isNaN(n)?0:n; }
function pct(x){ return (x*100).toFixed(1)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
const AGGS=["sum","avg","count","max","min"];
const COLORS=["blue","green","gray","purple","teal","orange","pink","red"];
const TYPE_LABEL={kpi:"KPI 指标卡组",cards:"多指标卡片组",rank:"排行榜",table:"明细表",stat:"统计数字卡",text:"文本模块",chart:"图表",gauge:"仪表盘/进度环",metric:"指标板",image:"图片",button:"按钮",progress:"进度图",wordcloud:"词云图",divider:"标题/分隔线",gantt:"甘特图"};
const CHART_TYPES=["bar","barH","stackBar","line","area","pie","doughnut","funnel","radar","scatter","heatmap"];
const LS_KEY="dashBuilder_v4";
const CANVAS_W=1200, GRID=10, GAP=16, MINW=200, MINH=120;
const DEF_SIZE={kpi:[1200,190],cards:[1200,420],rank:[590,360],table:[1200,320],stat:[320,170],text:[1200,130],chart:[590,380],gauge:[590,380],metric:[590,320],image:[400,300],button:[240,120],progress:[590,180],wordcloud:[590,360],divider:[590,80],gantt:[680,360]};

/* ================= 状态 ================= */
function autoLayout(widgets){
  let x=0,y=0,rowH=0;
  widgets.forEach(w=>{
    if(w.x!==undefined&&w.w) return;
    const [dw,dh]=DEF_SIZE[w.type]||[590,300];
    if(x+dw>CANVAS_W){ x=0; y+=rowH+GAP; rowH=0; }
    w.x=x; w.y=y; w.w=dw; w.h=dh;
    x+=dw+GAP; rowH=Math.max(rowH,dh);
  });
}
function buildExample(){
  const sid=uid("s");
  const F=(name,type)=>({id:uid("f"),name,type});
  const f=[F("门店","text"),F("品牌","text"),F("订单","number"),F("交车","number"),F("待交","number"),F("直销量","number"),F("按揭交车","number")];
  const [nameX,brandX,orderX,carX,pendX,directX,mortX]=f.map(x=>x.id);
  const data=[["宁波卓信","海洋",97,89,8,88,51],["余姚东兴","王朝",95,82,13,67,41],["余姚东吉","海洋",90,65,25,65,35],["宁波东御","王朝",68,54,14,47,26],["宁波丰澜","方程豹",50,53,-3,51,31],["宁波卓御","海洋",37,29,8,29,17],["慈溪丰浩","方程豹",36,28,8,28,11],["东江卓越","长城",34,25,9,21,9],["慈溪创信","长城",24,10,14,9,5],["宁波腾和","腾势",22,29,-7,26,11],["余姚丰浩","方程豹",21,25,-4,23,13],["宁波丰洛","方程豹",21,21,0,21,14],["余姚腾云","腾势",18,14,4,13,6]];
  const rows=data.map(arr=>{ const r={}; f.forEach((fd,i)=>r[fd.id]=arr[i]); return r; });
  const dashId=uid("d");
  const widgets=[
    {id:uid("w"),name:"核心指标",type:"kpi",sourceId:sid,config:{items:[{name:"当月订单",kind:"field",fieldId:orderX,aggregate:"sum",isPct:false,note:"",color:"blue"},{name:"当月交车",kind:"field",fieldId:carX,aggregate:"sum",isPct:false,note:"",color:"green"},{name:"当月订交比",kind:"ratio",numId:carX,denId:orderX,isPct:true,note:"交车/订单",color:"gray"},{name:"直销率",kind:"ratio",numId:directX,denId:carX,isPct:true,note:"直销量/总交车",color:"purple"},{name:"按揭渗透率",kind:"ratio",numId:mortX,denId:carX,isPct:true,note:"按揭交车/总交车",color:"teal"}]}},
    {id:uid("w"),name:"订单柱状图",type:"chart",sourceId:sid,config:{chartType:"bar",xFieldId:nameX,valueFieldIds:[orderX,carX],aggregate:"sum"}},
    {id:uid("w"),name:"交车按品牌分布",type:"chart",sourceId:sid,config:{chartType:"doughnut",xFieldId:brandX,valueFieldIds:[carX],aggregate:"sum"}},
    {id:uid("w"),name:"订单排行榜",type:"rank",sourceId:sid,config:{fieldId:orderX,order:"desc",topN:5,groupFieldId:nameX}},
    {id:uid("w"),name:"总交车进度",type:"gauge",sourceId:sid,config:{label:"本月交车达成",kind:"field",fieldId:carX,aggregate:"sum",max:700,suffix:"辆",color:"teal"}},
    {id:uid("w"),name:"综合指标板",type:"metric",sourceId:sid,config:{title:"销售综合看板",themeColor:"blue",numItems:[{label:"总订单",fieldId:orderX,aggregate:"sum",suffix:"单",isPct:false},{label:"总交车",fieldId:carX,aggregate:"sum",suffix:"辆",isPct:false},{label:"待交车",fieldId:pendX,aggregate:"sum",suffix:"辆",isPct:false}],ratioItems:[{label:"订交比",numId:carX,denId:orderX,color:"teal",isPct:true},{label:"直销率",numId:directX,denId:carX,color:"purple",isPct:true},{label:"按揭渗透",numId:mortX,denId:carX,color:"orange",isPct:true}],progItems:[{label:"交车达成率",numId:carX,denId:orderX,color:"blue",isPct:true}]}},
    {id:uid("w"),name:"门店多指标卡片",type:"cards",sourceId:sid,config:{groupFieldId:nameX,tagFieldId:brandX,numFieldIds:[orderX,carX,pendX],ratioFieldIds:[{label:"交车率",numId:carX,denId:orderX},{label:"直销率",numId:directX,denId:carX},{label:"按揭率",numId:mortX,denId:carX}],progFieldIds:[{label:"交车进度",numId:carX,denId:orderX}],colorMap:"teal,purple,orange,green,pink,blue,red",ratioPct:true,tagColor:"purple"}},
    {id:uid("w"),name:"进度图",type:"progress",sourceId:sid,config:{label:"交车达成率",kind:"ratio",numId:carX,denId:orderX,max:100,suffix:"",color:"teal",isPct:true}},
    {id:uid("w"),name:"按钮",type:"button",sourceId:sid,config:{text:"查看报表",color:"blue",action:"toast",link:""}},
    {id:uid("w"),name:"图片",type:"image",sourceId:sid,config:{url:"https://picsum.photos/seed/dash/400/280",fit:"contain"}},
    {id:uid("w"),name:"明细表",type:"table",sourceId:sid,config:{columnIds:[nameX,brandX,orderX,carX,pendX]}}
  ];
  autoLayout(widgets);
  return {
    sources:[{id:sid,name:"门店销售数据",fields:f,rows}],
    dashboards:[{id:dashId,name:"销售运营看板",widgets}],
    currentId:dashId
  };
}
function migrate(s){
  if(s&&!s.dashboards){ if(s.widgets){ const d={id:uid("d"),name:"看板1",widgets:s.widgets}; s.dashboards=[d]; s.currentId=d.id; delete s.widgets; } }
  if(!s||!s.dashboards||!s.dashboards.length) s=buildExample();
  s.dashboards.forEach(d=>autoLayout(d.widgets||[]));
  s.theme=s.theme||"light"; s.showGrid=s.showGrid||false; s.gridSize=s.gridSize||20; s.exportScale=s.exportScale||2; s.bgImage=s.bgImage||"";
  return s;
}
let state=migrate(loadState());
function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
function saveState(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){} }
function currentDash(){ return state.dashboards.find(d=>d.id===state.currentId)||state.dashboards[0]; }
function getSource(id){ return state.sources.find(s=>s.id===id); }
function fieldName(s,fid){ const f=s.fields.find(x=>x.id===fid); return f?f.name:""; }
function fieldVal(s,row,fid){ return row[fid]===undefined?"":row[fid]; }

/* ================= 看板管理 ================= */
function renderTabs(){ document.getElementById("dashTabs").innerHTML=state.dashboards.map(d=>`<div class="dash-tab ${d.id===state.currentId?"active":""}" onclick="switchDashboard('${d.id}')"><span>${esc(d.name)}</span><button class="menu-btn" onclick="event.stopPropagation();openDashMenu(event,'${d.id}')">&#8942;</button></div>`).join(""); }
function switchDashboard(id){ if(id===state.currentId) return; state.currentId=id; saveState(); render(); }
function addDashboard(){ const n=state.dashboards.length+1; const d={id:uid("d"),name:"新看板"+n,widgets:[]}; state.dashboards.push(d); state.currentId=d.id; saveState(); render(); toast("已新建看板："+d.name); }
function renameDashboard(id){ const d=state.dashboards.find(x=>x.id===id); if(!d)return; const v=prompt("重命名看板：",d.name); if(v&&v.trim()){ d.name=v.trim(); saveState(); renderTabs(); } }
function dupDashboard(id){ const d=state.dashboards.find(x=>x.id===id); if(!d)return; const copy=JSON.parse(JSON.stringify(d)); copy.id=uid("d"); copy.name=d.name+"(副本)"; copy.widgets=copy.widgets.map(w=>{w.id=uid("w");return w;}); autoLayout(copy.widgets); state.dashboards.splice(state.dashboards.indexOf(d)+1,0,copy); saveState(); renderTabs(); toast("已复制看板"); }
function delDashboard(id){ if(state.dashboards.length<=1){ toast("至少保留一个看板"); return; } if(!confirm("确定删除该看板及全部组件？"))return; state.dashboards=state.dashboards.filter(x=>x.id!==id); if(state.currentId===id) state.currentId=state.dashboards[0].id; saveState(); render(); toast("看板已删除"); }
function openDashMenu(e,id){ document.querySelectorAll(".menu").forEach(m=>m.remove()); const menu=document.createElement("div"); menu.className="menu"; menu.innerHTML=`<div class="mi" onclick="renameDashboard('${id}');this.closest('.menu').remove()">重命名</div><div class="mi" onclick="dupDashboard('${id}');this.closest('.menu').remove()">复制看板</div><div class="mi danger" onclick="delDashboard('${id}');this.closest('.menu').remove()">删除看板</div>`; document.body.appendChild(menu); const r=menu.getBoundingClientRect(); menu.style.left=Math.min(e.clientX,window.innerWidth-r.width-10)+"px"; menu.style.top=(e.clientY+8)+"px"; setTimeout(()=>document.addEventListener("click",function h(){menu.remove();document.removeEventListener("click",h);}),0); }

/* ================= 渲染 ================= */
function render(){
  disposeCharts();
  const dash=currentDash();
  applyTheme(state.theme||"light"); applyBg(); document.getElementById("appTitle").textContent=state.title||"通用数据看板";
  document.getElementById("appSub").textContent=(dash?dash.name:"")+(state.sub?" · "+state.sub:"");
  renderTabs();
  const canvas=document.getElementById("canvas");
  canvas.classList.toggle("grid-on", !!state.showGrid);
  if(state.showGrid) canvas.style.backgroundSize=(state.gridSize||20)+"px "+(state.gridSize||20)+"px";
  const widgets=dash?dash.widgets:[];
  if(!widgets.length){ canvas.style.height="420px"; canvas.innerHTML='<div class="canvas-empty">当前看板暂无组件，点击右上角「+ 添加组件」开始搭建。</div>'; return; }
  canvas.innerHTML=widgets.map(w=>{
    const _st=(w.config&&w.config.style)||{};
    let _mstl=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px`;
    if(_st.bg) _mstl+=`;background:${COLOR_HEX[_st.bg]||_st.bg}`;
    if(_st.radius!=null) _mstl+=`;border-radius:${_st.radius}px`;
    if(_st.shadow) _mstl+=`;box-shadow:0 4px 18px rgba(0,0,0,.12)`;
    if(_st.border) _mstl+=`;border:1px solid var(--line)`;
    if(_st.pad!=null) _mstl+=`;padding:${_st.pad}px`;
    if(_st.opacity!=null&&_st.opacity<100) _mstl+=`;opacity:${_st.opacity/100}`;
    if(_st.borderColor) _mstl+=`;border-color:${COLOR_HEX[_st.borderColor]||_st.borderColor}`;
    return `
    <div class="module ${w.hidden?'hidden-w':''}" data-id="${w.id}" style="${_mstl}" ondblclick="editWidget('${w.id}')">
      <div class="module-bar" title="拖拽移动" ${w.config.titleShow===false?'style="display:none"':''}>
        <span class="m-title" style="${w.config.titleSize?('font-size:'+w.config.titleSize+'px;'):''}${w.config.titleColor?('color:'+(COLOR_HEX[w.config.titleColor]||w.config.titleColor)+';'):''}${w.config.titleAlign?('text-align:'+w.config.titleAlign+';'):''}">${esc(w.name)}</span>
        <span class="m-type">${TYPE_LABEL[w.type]||w.type}</span>
        <span class="m-actions">
          <span class="vis-btn" title="显示/隐藏" onclick="toggleWidgetVis('${w.id}')">${w.hidden?'&#128065;&#8205;&#8204;':'&#128065;'}</span>
          <button class="btn" title="上移" onclick="moveWidget('${w.id}',-1)">&#9650;</button>
          <button class="btn" title="下移" onclick="moveWidget('${w.id}',1)">&#9660;</button>
          <button class="btn" title="复制" onclick="dupWidget('${w.id}')">复制</button>

function buildGanttOption(w,s){
  const c=w.config,rows=getFilteredRows(s);
  const sval=v=>{ const n=Number(v); if(v!==""&&!isNaN(n))return n; const t=Date.parse(v); return isNaN(t)?0:t; };
  const tasks=rows.filter(r=>r[c.taskFieldId]&&r[c.taskFieldId]!=="").map(r=>({name:String(r[c.taskFieldId]),start:sval(r[c.startFieldId]),end:sval(r[c.endFieldId]),prog:c.progressFieldId?sval(r[c.progressFieldId]):0})).sort((a,b)=>a.start-b.start);
  const col=COLOR_HEX[c.color]||"#3b82f6";
  const cats=tasks.map(t=>t.name);
  const startData=tasks.map(t=>t.start);
  const durData=tasks.map(t=>Math.max(t.end-t.start,0));
  const series=[
    {type:"bar",stack:"g",itemStyle:{color:"transparent"},data:startData,barWidth:16},
    {type:"bar",stack:"g",itemStyle:{color:col},data:durData,label:{show:true,position:"right",formatter:p=>tasks[p.dataIndex].end}}
  ];
  return {tooltip:{trigger:"axis",axisPointer:{type:"shadow"},formatter:ps=>{const i=ps[0].dataIndex;return tasks[i].name+" \u5f00\u59cb "+tasks[i].start+" ~ "+tasks[i].end+(c.progressFieldId?("  \u8fdb\u5ea6 "+Math.round(tasks[i].prog)+"%"):"");}},grid:{left:80,right:50,top:20,bottom:30},xAxis:{type:"value",axisLabel:{color:"#8a94a6"}},yAxis:{type:"category",data:cats,inverse:true,axisLabel:{color:"#333"}},series};
}
function drawCharts(){ if(typeof echarts==="undefined"){ document.querySelectorAll("[data-chart]").forEach(el=>{el.outerHTML='<div class="chart-fallback">图表库未加载（需联网）</div>';}); return; }
  document.querySelectorAll("[data-chart]").forEach(el=>{ const w=currentDash().widgets.find(x=>x.id===el.dataset.chart); if(!w)return; const s=getSource(w.sourceId); if(!s)return; const inst=echarts.init(el); _charts.push(inst); inst.setOption(decorateChart(buildChartOption(w,s), w.config)); });
  document.querySelectorAll("[data-chart-gauge]").forEach(el=>{ const w=currentDash().widgets.find(x=>x.id===el.dataset.chartGauge); if(!w)return; const s=getSource(w.sourceId); if(!s)return; const c=w.config; let val=c.kind==="ratio"?ratioTotal(s,{numId:c.numId,denId:c.denId})*100:fieldAgg(s,c.fieldId,c.aggregate); const max=c.max||100; const inst=echarts.init(el); _charts.push(inst); inst.setOption({series:[{type:"gauge",progress:{show:true,width:14},axisLine:{lineStyle:{width:14}},min:0,max:max,data:[{value:val,name:c.label||""}],detail:{valueAnimation:true,formatter:"{value}"+esc(c.suffix||"")}}]}); }); 
  document.querySelectorAll("[data-chart-gantt]").forEach(el=>{ const w=currentDash().widgets.find(x=>x.id===el.dataset.chartGantt); if(!w)return; const s=getSource(w.sourceId); if(!s)return; const inst=echarts.init(el); _charts.push(inst); inst.setOption(buildGanttOption(w,s)); }); }

/* ================= 拖拽 ================= */
function overlaps(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function resolveOverlaps(){
  const ws=currentDash().widgets.filter(w=>!w.hidden);
  let guard=0, movedAny=false;
  while(guard<100){
    guard++; let moved=false;
    for(let i=0;i<ws.length;i++) for(let j=i+1;j<ws.length;j++){
      const a=ws[i], b=ws[j];
      if(overlaps(a,b)){
        const lower=(a.y<=b.y)?b:a, upper=(a.y<=b.y)?a:b;
        const ny=Math.max(lower.y, upper.y+upper.h+GAP);
        if(ny!==lower.y){ lower.y=Math.round(ny/GRID)*GRID; moved=true; movedAny=true; }
      }
    }
    if(!moved) break;
  }
  updateCanvasHeight(); saveState(); render();
  if(movedAny) toast("\u5df2\u81ea\u52a8\u6574\u7406\u7ec4\u4ef6\u5e03\u5c40\uff0c\u89e3\u9664\u5806\u53e0");
  else if(arguments.length===0) toast("\u5f53\u524d\u5e03\u5c40\u65e0\u5806\u53e0");
}
function initDnD(){
  // 拖拽移动（标题栏）
  document.querySelectorAll(".module-bar").forEach(bar=>{
    bar.addEventListener("pointerdown",e=>{
      if(e.target.closest(".m-actions")) return;
      const mod=bar.closest(".module");
      const w=currentDash().widgets.find(x=>x.id===mod.dataset.id);
      if(!w) return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;
      mod.classList.add("dragging");
      function onMove(ev){ const x=Math.max(0,Math.round((ox+ev.clientX-sx)/GRID)*GRID); const y=Math.max(0,Math.round((oy+ev.clientY-sy)/GRID)*GRID); mod.style.left=x+"px"; mod.style.top=y+"px"; mod._dx=x; mod._dy=y; }
      function onUp(){ document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp); mod.classList.remove("dragging"); if(mod._dx!==undefined){ w.x=mod._dx; w.y=mod._dy; delete mod._dx; delete mod._dy; resolveOverlaps(true); } }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp);
    });
  });
  // 拖拽缩放（右下角手柄）
  document.querySelectorAll(".resize-h").forEach(h=>{
    h.addEventListener("pointerdown",e=>{
      e.preventDefault(); e.stopPropagation();
      const mod=h.closest(".module");
      const w=currentDash().widgets.find(x=>x.id===mod.dataset.id);
      if(!w) return;
      const sx=e.clientX,sy=e.clientY,ow=w.w,oh=w.h;
      mod.classList.add("dragging");
      function onMove(ev){ const nw=Math.max(MINW,Math.round((ow+ev.clientX-sx)/GRID)*GRID); const nh=Math.max(MINH,Math.round((oh+ev.clientY-sy)/GRID)*GRID); mod.style.width=nw+"px"; mod.style.height=nh+"px"; mod._nw=nw; mod._nh=nh; }
      function onUp(){ document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp); mod.classList.remove("dragging"); if(mod._nw){ w.w=mod._nw; w.h=mod._nh; delete mod._nw; delete mod._nh; resolveOverlaps(true); } }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp);
    });
  });
}

function renderSrcEditor(){ const box=document.getElementById("srcEditor"),s=curSrc(); if(!s){box.innerHTML='<div class="empty">请选择或新建数据源。</div>';return;} const fieldsHtml=s.fields.map((f,i)=>`<div class="field-row"><input data-fi="${i}" data-k="name" value="${esc(f.name)}" placeholder="字段名" style="width:160px"><select data-fi="${i}" data-k="type"><option value="number" ${f.type==="number"?"selected":""}>数字</option><option value="text" ${f.type==="text"?"selected":""}>文本</option></select><span class="fd" onclick="delField(${i})">删除</span></div>`).join(""); const cols=s.fields; const tableHtml=cols.length?`<table class="data"><thead><tr>${cols.map(f=>`<th>${esc(f.name)}</th>`).join("")}<th></th></tr></thead><tbody>${s.rows.map((r,ri)=>`<tr data-r="${ri}">${cols.map(f=>`<td><input data-r="${ri}" data-f="${f.id}" value="${esc(r[f.id]??"")}"></td>`).join("")}<td><span class="fd" onclick="delRow(${ri})">删除</span></td></tr>`).join("")}</tbody></table>`:'<div class="hint">该数据源暂无字段，请先添加字段模板。</div>'; box.innerHTML=`<div class="f-label">数据源名称</div><div class="cfg-row"><input id="srcName" value="${esc(s.name)}" style="width:220px"></div><div class="f-label">字段模板（自定义结构）</div><div id="fieldList">${fieldsHtml}</div><button class="btn sm" onclick="addField()">+ 添加字段</button><div class="f-label">数据记录</div>${tableHtml}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn sm" onclick="addRow()">+ 新增行</button><button class="btn sm" onclick="importToSource('${s.id}')">导入 Excel/CSV</button><button class="btn sm" onclick="pasteToSource('${s.id}')">粘贴数据</button></div>`; document.getElementById("srcName").addEventListener("input",e=>s.name=e.target.value); document.querySelectorAll("#fieldList [data-fi]").forEach(el=>el.addEventListener("input",()=>{const f=s.fields[+el.dataset.fi];f[el.dataset.k]=el.value;})); document.querySelectorAll("#srcEditor table.data input").forEach(el=>el.addEventListener("input",()=>{s.rows[+el.dataset.r][el.dataset.f]=el.value;})) function importToSource(id){ const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls,.csv,.tsv"; inp.onchange=()=>{ const file=inp.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=e=>{ const data=new Uint8Array(e.target.result); let rows; if(typeof XLSX!=="undefined"){ const wb=XLSX.read(data,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(ws,{defval:""}); } else { toast("Excel 解析库未加载（需联网），请使用粘贴方式"); return; } applyImportRows(id,rows); }; reader.readAsArrayBuffer(file); }; inp.click(); }
function applyImportRows(id,rows){ const s=srcDraft.find(x=>x.id===id); if(!rows||!rows.length){toast("数据为空");return;} const head=Object.keys(rows[0]); const fidMap={}; head.forEach(h=>{ let f=s.fields.find(x=>x.name===h); if(!f){f={id:uid("f"),name:h,type:"number"};s.fields.push(f);} fidMap[h]=f.id; }); s.rows=rows.map(o=>{ const r={}; head.forEach(h=>{r[fidMap[h]]=o[h];}); return r; }); renderSrcEditor(); toast("已导入 "+rows.length+" 行"); }
function pasteToSource(id){ const txt=prompt("粘贴 CSV/TSV 数据（首行为字段名）:"); if(!txt)return; const delim=txt.includes("\t")?"\t":","; const lines=txt.split(/\r?\n/).filter(l=>l.trim()!==""); if(lines.length<2){toast("数据不足");return;} const head=lines[0].split(delim).map(h=>h.trim()); const rows=lines.slice(1).map(l=>{ const c=l.split(delim); const o={}; head.forEach((h,j)=>{ let v=c[j]?.trim()??""; const n=Number(v); o[h]=(v!==""&&!isNaN(n)&&/^[-\d.]+$/.test(v))?n:v; }); return o; }); applyImportRows(id,rows); }

/* ================= 颜色选择器（WPS仪表盘式） ================= */
const COLOR_HEX={blue:"#3b82f6",green:"#22c55e",gray:"#9aa7b5",purple:"#a855f7",teal:"#14b8a6",orange:"#f59e0b",pink:"#ec4899",red:"#ef4444"};
function cpHTML(value, extra){
  const v=value||"gray";
  return `<span class="color-picker" ${extra||""} data-cp="${v}"><span class="cp-swatch" style="background:${COLOR_HEX[v]||"#9aa7b5"}"></span></span>`;
}
function openColorPalette(anchor, cb){
  document.querySelectorAll(".cp-pop").forEach(p=>p.remove());
  const cur=anchor.dataset.cp||"blue";
  const pop=document.createElement("div");
  pop.className="cp-pop";
  pop.innerHTML=COLORS.map(c=>`<span class="cpc ${c===cur?"sel":""}" style="background:${COLOR_HEX[c]}" data-c="${c}" title="${c}"></span>`).join("");
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.max(4,Math.min(r.left,window.innerWidth-160))+"px";
  pop.style.top=Math.min((r.bottom+6),window.innerHeight-160)+"px";
  pop.querySelectorAll(".cpc").forEach(cpc=>{
    cpc.addEventListener("click",ev=>{
      ev.stopPropagation();
      const val=cpc.dataset.c;
      anchor.dataset.cp=val;
      const sw=anchor.querySelector(".cp-swatch"); if(sw)sw.style.background=COLOR_HEX[val];
      cb&&cb(val);
      pop.remove();
    });
  });
  setTimeout(()=>document.addEventListener("click",function h(){pop.remove();document.removeEventListener("click",h);}),0);
}
function applyCp(el,val){
  if(el.dataset.i!==undefined){
    const i=+el.dataset.i;
    if(el.dataset.mr!==undefined) wDraft.config.ratioItems[i][el.dataset.k]=val;
    else if(el.dataset.mp!==undefined) wDraft.config.progItems[i][el.dataset.k]=val;
    else wDraft.config.items[i][el.dataset.k]=val;
  } else if(el.dataset.cpfield){
    wDraft.config[el.dataset.cpfield]=val;
  }
}
function bindColorPickers(){
  document.querySelectorAll(".color-picker").forEach(el=>{
    el.onclick=e=>{ e.stopPropagation(); openColorPalette(el,v=>applyCp(el,v)); };
  });
}

/* ================= 全局筛选器 ================= */
let filterState = {};
function toggleFilterBar() {
  const bar = document.getElementById("filterBar");
  bar.classList.toggle("hidden");
  if (!bar.classList.contains("hidden")) {
    const sel = document.getElementById("filterSource");
    sel.innerHTML = '<option value="">选择数据源</option>' + state.sources.map(s => '<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
    if (filterState.sourceId) { sel.value = filterState.sourceId; renderFilterFields(); }
  }
}
function renderFilterFields() {
  const sid = document.getElementById("filterSource").value;
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>';
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  const fo0=document.getElementById("filterOp"); if(fo0)fo0.value="eq";
  if (!sid) return;
  const s = getSource(sid); if (!s) return;
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>' + s.fields.map(f => '<option value="'+f.id+'">'+esc(f.name)+'</option>').join("");
  filterState.sourceId = sid;
}
function renderFilterValues() {
  const fid = document.getElementById("filterField").value;
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  if (!fid) return;
  const s = getSource(filterState.sourceId); if (!s) return;
  const vals = [...new Set(s.rows.map(r => String(r[fid] ?? "")))].sort();
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>' + vals.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join("");
  filterState.fieldId = fid;
}
function applyFilter() {
  const foA=document.getElementById("filterOp"); filterState.op=foA?foA.value:"eq";
  filterState.value = document.getElementById("filterValue").value || "";
  renderFilterTags(); render();
}
function clearFilter() {
  filterState = {};
  document.getElementById("filterSource").value = "";
  document.getElementById("filterField").innerHTML = '<option value="">选择字段</option>';
  document.getElementById("filterValue").innerHTML = '<option value="">全部</option>';
  renderFilterTags(); render();
}
function renderFilterTags() {
  const box = document.getElementById("filterTags");
  if (!filterState.sourceId || !filterState.fieldId) { box.innerHTML = ""; return; }
  const s = getSource(filterState.sourceId);
  const fn = s ? fieldName(s, filterState.fieldId) : "";
  const sym=OP_SYM[filterState.op]||"="; const disp=(filterState.op==="isEmpty"||filterState.op==="notEmpty")?"":(esc(filterState.value || "全部")); box.innerHTML = '<span class="f-tag">'+esc(fn)+' '+sym+' '+disp+' <span class="x" onclick="clearFilter()">&times;</span></span>';
}
let _curWidget=null;
const FILTER_OPS=[["eq","\u7b49\u4e8e"],["neq","\u4e0d\u7b49\u4e8e"],["contains","\u5305\u542b"],["notContains","\u4e0d\u5305\u542b"],["gt","\u5927\u4e8e"],["gte","\u5927\u4e8e\u7b49\u4e8e"],["lt","\u5c0f\u4e8e"],["lte","\u5c0f\u4e8e\u7b49\u4e8e"],["isEmpty","\u4e3a\u7a7a"],["notEmpty","\u4e0d\u4e3a\u7a7a"]];
const OP_SYM={eq:"=",neq:"\u2260",contains:"\u542b",notContains:"\u4e0d\u542b",gt:">",gte:"\u2265",lt:"<",lte:"\u2264",isEmpty:"\u4e3a\u7a7a",notEmpty:"\u4e0d\u4e3a\u7a7a"};
function filterMatch(row,f){
  if(!f.fieldId) return true;
  const s=String(row[f.fieldId]??"");
  const t=String(f.value??"");
  switch(f.op||"eq"){
    case "eq":return s===t;
    case "neq":return s!==t;
    case "contains":return s.includes(t);
    case "notContains":return !s.includes(t);
    case "isEmpty":return s==="";
    case "notEmpty":return s!=="";
    case "gt":{const n=Number(row[f.fieldId]),m=Number(t);return !isNaN(n)&&!isNaN(m)&&n>m;}
    case "gte":{const n=Number(row[f.fieldId]),m=Number(t);return !isNaN(n)&&!isNaN(m)&&n>=m;}
    case "lt":{const n=Number(row[f.fieldId]),m=Number(t);return !isNaN(n)&&!isNaN(m)&&n<m;}
    case "lte":{const n=Number(row[f.fieldId]),m=Number(t);return !isNaN(n)&&!isNaN(m)&&n<=m;}
  }
  return true;
}
function getFilteredRows(s) {
  let rows = s.rows;
  if (filterState.sourceId === s.id && filterState.fieldId) {
    rows = rows.filter(r => filterMatch(r,{fieldId:filterState.fieldId,op:filterState.op||"eq",value:filterState.value||""}));
  }
  if (_curWidget && _curWidget.config && _curWidget.config.filters && _curWidget.config.filters.length) {
    const rel=_curWidget.config.filterRel||"and";
    rows = rows.filter(r => { const res=_curWidget.config.filters.map(f=>filterMatch(r,f)); return rel==="or"?res.some(Boolean):res.every(Boolean); });
  }
  return rows;
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  try { localStorage.setItem("dashTheme", document.body.classList.contains("dark") ? "dark" : "light"); } catch(e) {}
  setTimeout(() => { drawCharts(); }, 100);
}
(function loadTheme() {
  try { if (localStorage.getItem("dashTheme") === "dark") document.body.classList.add("dark"); } catch(e) {}
})();
/* ================= 导出图片 ================= */
async function exportImage() {
  toast("正在生成截图...");
  const canvas = document.getElementById("canvas");
  const actions = canvas.querySelectorAll(".m-actions, .resize-h");
  actions.forEach(a => a.style.display = "none");
  try {
    if (typeof html2canvas === "undefined") {
      await new Promise((res, rej) => {
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
        sc.onload = res; sc.onerror = rej;
        document.head.appendChild(sc);
      });
    }
    if (typeof html2canvas === "undefined") throw new Error("not loaded");
    const el = await html2canvas(canvas, {backgroundColor: getComputedStyle(document.body).backgroundColor, scale: (state.exportScale||2)});
    const link = document.createElement("a");
    link.download = (currentDash().name || "kanban") + ".png";
    link.href = el.toDataURL("image/png");
    link.click();
    toast("截图已保存");
  } catch(e) {
    toast("截图库需联网，可用 Ctrl+P 打印为PDF替代");
  }
  actions.forEach(a => a.style.display = "");
}
/* ================= 导出/导入配置 ================= */
function exportJSON() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const link = document.createElement("a");
  link.download = "kanban_config.json";
  link.href = URL.createObjectURL(blob);
  link.click();
  toast("配置已导出");
}
function importJSON() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try { const data = JSON.parse(e.target.result);
        if (!data.dashboards) { toast("文件格式不正确"); return; }
        state = migrate(data); saveState(); render(); toast("配置已导入");
      } catch(err) { toast("解析失败"); }
    };
    reader.readAsText(file);
  };
  inp.click();
}
